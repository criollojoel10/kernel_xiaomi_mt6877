name: Build Rubyx AOSP DroidSpaces Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repositorio kernel original RubyxLabs"
        required: true
        default: "RubyxLabs/kernel_xiaomi_mt6877"
        type: string
      kernel_branch:
        description: "Branch base actualizado"
        required: true
        default: "lineage-23.2"
        type: string
      defconfig:
        description: "Defconfig; autodetecta ruby/mt6877 si no existe"
        required: true
        default: "ruby_defconfig"
        type: string
      aeron_repo:
        description: "Repo usado solo como base AnyKernel3"
        required: true
        default: "DXRN-MoonWake/aeron_kernel_xiaomi_ruby"
        type: string
      aeron_tag:
        description: "Release tag usado como base AnyKernel3"
        required: true
        default: "1.0.2"
        type: string
      output_suffix:
        description: "Sufijo del ZIP final"
        required: true
        default: "DroidSpaces-AOSP"
        type: string

permissions:
  contents: write
  actions: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEVICE_CODENAME: ruby
  CLANG_VERSION: clang-r563880
  CLANG_COMMIT: 6f88d37dd82ba741ca279539d44bb7da27ab1844
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Stock AOSP + DroidSpaces (Enhanced)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Prepare and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace artifacts/logs artifacts/zips toolchains
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git \
            libssl-dev libelf-dev libfl-dev libncurses6 \
            python3 python-is-python3 python3-dev python3-setuptools \
            wget curl patch zip unzip rsync jq file \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            lz4 zstd xz-utils ca-certificates ccache
          SWAPFILE=/mnt/kernel-build-swapfile
          if ! swapon --show | grep -q "$SWAPFILE"; then
            sudo rm -f "$SWAPFILE" || true
            sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192
            sudo chmod 600 "$SWAPFILE"
            sudo mkswap "$SWAPFILE"
            sudo swapon "$SWAPFILE"
          fi
          df -h || true
          free -h || true

      - name: Restore clang cache
        uses: actions/cache@v4
        with:
          path: toolchains/${{ env.CLANG_VERSION }}
          key: aosp-${{ env.CLANG_VERSION }}-${{ env.CLANG_COMMIT }}-linux-x86

      - name: Download AOSP clang
        shell: bash
        run: |
          set -euo pipefail
          CLANG_DIR="$GITHUB_WORKSPACE/toolchains/$CLANG_VERSION"
          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            rm -rf "$CLANG_DIR"
            mkdir -p "$CLANG_DIR"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/${CLANG_VERSION}.tar.gz"
            curl -L --fail --retry 5 --retry-delay 5 "$CLANG_URL" -o "workspace/${CLANG_VERSION}.tar.gz"
            tar -xzf "workspace/${CLANG_VERSION}.tar.gz" -C "$CLANG_DIR"
          fi
          "$CLANG_DIR/bin/clang" --version | tee artifacts/logs/clang-version.log

      - name: Clone original RubyxLabs kernel source
        shell: bash
        env:
          KERNEL_REPO: ${{ github.event.inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
        run: |
          set -euo pipefail
          cd workspace
          git clone --depth 1 --branch "$KERNEL_BRANCH" "https://github.com/${KERNEL_REPO}.git" kernel-src
          cd kernel-src
          git remote -v | tee ../../artifacts/logs/kernel-source-remote.log
          git rev-parse HEAD | tee ../../artifacts/logs/kernel-source-commit.log
          git log --oneline -20 | tee ../../artifacts/logs/kernel-source-history.log
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile | tee ../../artifacts/logs/kernel-version.log
          find arch/arm64/configs -maxdepth 3 -type f -iname '*defconfig' | sort | tee ../../artifacts/logs/available-defconfigs.log

      - name: Configure DroidSpaces Enhanced
        shell: bash
        env:
          DEFCONFIG_INPUT: ${{ github.event.inputs.defconfig }}
          OUTPUT_SUFFIX: ${{ github.event.inputs.output_suffix }}
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchains/$CLANG_VERSION/bin:$PATH"
          cd workspace/kernel-src
          mkdir -p "$OUT_DIR" arch/arm64/configs/vendor

          cat > arch/arm64/configs/vendor/droidspaces.config <<'EOF'
          # === Namespaces ===
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_NSFS=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_NET_NS=y
          CONFIG_USER_NS=n

          # === Seccomp ===
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          # === Cgroups v1 (completo para 4.19) ===
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_PERF=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_CPUSET=y
          CONFIG_BLK_CGROUP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_RT_GROUP_SCHED=y
          CONFIG_NET_CLS_CGROUP=y

          # === Devtmpfs ===
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y

          # === Config para debug/info ===
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y

          # === Filesystems ===
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_EXT4_FS_SECURITY=y
          CONFIG_FUSE_FS=y

          # === Network devices ===
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_TUN=y
          CONFIG_DUMMY=y
          CONFIG_MACVLAN=y
          CONFIG_IPVLAN=y
          CONFIG_VXLAN=y

          # === Netfilter completo ===
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_CONNTRACK_EVENTS=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y

          # === BPF ===
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y

          # === Android: quitar restricciones de red ===
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF
          sed -i 's/^[[:space:]]*//' arch/arm64/configs/vendor/droidspaces.config

          cat > arch/arm64/configs/vendor/no-root-frameworks.config <<'EOF'
          # CONFIG_KSU is not set
          # CONFIG_KSU_LSM_SECURITY_HOOKS is not set
          # CONFIG_KSU_MANUAL_HOOK is not set
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_SUSFS is not set
          # CONFIG_KPM is not set
          EOF
          sed -i 's/^[[:space:]]*//' arch/arm64/configs/vendor/no-root-frameworks.config

          cat arch/arm64/configs/vendor/droidspaces.config | tee ../../artifacts/logs/droidspaces.config
          cat arch/arm64/configs/vendor/no-root-frameworks.config | tee ../../artifacts/logs/no-root-frameworks.config

          MAKE_COMMON=(
            O="$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang"
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
          )

          DEFCONFIG="$DEFCONFIG_INPUT"
          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            DEFCONFIG="$(find arch/arm64/configs -maxdepth 3 -type f \( -name '*ruby*defconfig' -o -name '*mt6877*defconfig' \) | sed 's#arch/arm64/configs/##' | sort | head -n1)"
          fi
          if [ -z "$DEFCONFIG" ] || [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "ERROR: no se encontró defconfig ruby/mt6877" | tee ../../artifacts/logs/defconfig-error.log
            find arch/arm64/configs -maxdepth 3 -type f -iname '*defconfig' | sort | tee -a ../../artifacts/logs/defconfig-error.log
            exit 1
          fi
          echo "DEFCONFIG=$DEFCONFIG" | tee ../../artifacts/logs/selected-defconfig.log

          make "${MAKE_COMMON[@]}" "$DEFCONFIG"
          scripts/config --file "$OUT_DIR/.config" --set-str LOCALVERSION "-$OUTPUT_SUFFIX"
          scripts/config --file "$OUT_DIR/.config" --disable LOCALVERSION_AUTO || true
          scripts/kconfig/merge_config.sh -m -O "$OUT_DIR" "$OUT_DIR/.config" arch/arm64/configs/vendor/no-root-frameworks.config
          scripts/kconfig/merge_config.sh -m -O "$OUT_DIR" "$OUT_DIR/.config" arch/arm64/configs/vendor/droidspaces.config
          make "${MAKE_COMMON[@]}" olddefconfig
          cp "$OUT_DIR/.config" ../../artifacts/logs/final-kernel.config

          echo "== DroidSpaces critical config check ==" | tee ../../artifacts/logs/droidspaces-critical-status.log
          CRITICAL_OPTS=(
            CONFIG_IPC_NS CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE
            CONFIG_DEVTMPFS CONFIG_DEVTMPFS_MOUNT CONFIG_TMPFS_XATTR
            CONFIG_SECCOMP CONFIG_SECCOMP_FILTER
            CONFIG_IKCONFIG CONFIG_IKCONFIG_PROC
            CONFIG_CGROUP_CPUSET CONFIG_BLK_CGROUP CONFIG_CFS_BANDWIDTH
            CONFIG_NF_CONNTRACK_EVENTS CONFIG_IP_NF_TARGET_REDIRECT
          )
          FAIL=0
          for opt in "${CRITICAL_OPTS[@]}"; do
            if grep -q "^$opt=y" "$OUT_DIR/.config"; then
              grep "^$opt=y" "$OUT_DIR/.config" | tee -a ../../artifacts/logs/droidspaces-critical-status.log
            else
              echo "MISSING_OR_NOT_BUILTIN: $opt" | tee -a ../../artifacts/logs/droidspaces-critical-status.log
              FAIL=1
            fi
          done
          echo "== Root frameworks check ==" | tee ../../artifacts/logs/no-root-frameworks-status.log
          grep -E '^CONFIG_KSU|^CONFIG_KPM|^CONFIG_KSU_SUSFS' "$OUT_DIR/.config" | tee -a ../../artifacts/logs/no-root-frameworks-status.log || true
          test "$FAIL" -eq 0

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchains/$CLANG_VERSION/bin:$PATH"
          cd workspace/kernel-src
          MAKE_COMMON=(
            O="$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang"
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
          )
          make -j"$(nproc --all)" "${MAKE_COMMON[@]}" 2>&1 | tee ../../artifacts/logs/build.log
          find "$OUT_DIR/arch/arm64/boot" -maxdepth 4 -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' -o -name 'dtbo.img' \) -printf '%p %s bytes\n' | sort | tee ../../artifacts/logs/build-outputs.log
          test -f "$OUT_DIR/arch/arm64/boot/Image.gz" || test -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb"

      - name: Download Aeron AnyKernel3 base
        shell: bash
        env:
          AERON_REPO: ${{ github.event.inputs.aeron_repo }}
          AERON_TAG: ${{ github.event.inputs.aeron_tag }}
        run: |
          set -euo pipefail
          cd workspace
          curl -L --fail -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${AERON_REPO}/releases/tags/${AERON_TAG}" -o aeron-release.json
          cp aeron-release.json ../artifacts/logs/aeron-release-${AERON_TAG}.json
          jq -r '.assets[] | "asset: \(.name) url=\(.browser_download_url)"' aeron-release.json | tee ../artifacts/logs/aeron-release-assets.log
          ZIP_URL="$(jq -r '.assets[] | select(.name | test("\\.zip$"; "i")) | .browser_download_url' aeron-release.json | head -n1)"
          test -n "$ZIP_URL" && test "$ZIP_URL" != null
          curl -L --fail --retry 5 --retry-delay 5 "$ZIP_URL" -o aeron-anykernel-base.zip
          rm -rf anykernel && mkdir -p anykernel
          unzip -q aeron-anykernel-base.zip -d anykernel
          find anykernel -maxdepth 4 -type f | sort | tee ../artifacts/logs/anykernel-base-tree.log

      - name: Package AnyKernel3 ZIP
        shell: bash
        env:
          OUTPUT_SUFFIX: ${{ github.event.inputs.output_suffix }}
          KERNEL_REPO: ${{ github.event.inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
        run: |
          set -euo pipefail
          cd workspace
          AK=anykernel
          KERNEL_SRC="kernel-src/$OUT_DIR/arch/arm64/boot"
          rm -f "$AK"/Image "$AK"/Image.gz "$AK"/Image.gz-dtb "$AK"/*.dtb "$AK"/*.dtbo "$AK"/dtbo.img || true
          [ ! -f "$KERNEL_SRC/Image.gz-dtb" ] || cp "$KERNEL_SRC/Image.gz-dtb" "$AK/Image.gz-dtb"
          [ ! -f "$KERNEL_SRC/Image.gz" ] || cp "$KERNEL_SRC/Image.gz" "$AK/Image.gz"
          [ ! -f "$KERNEL_SRC/Image" ] || cp "$KERNEL_SRC/Image" "$AK/Image"
          [ ! -f "$KERNEL_SRC/dtbo.img" ] || cp "$KERNEL_SRC/dtbo.img" "$AK/dtbo.img"
          find "$KERNEL_SRC/dts" -type f \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp -f {} "$AK/" \; 2>/dev/null || true

          cat > "$AK/build-manifest-droidspaces-aosp.txt" <<EOF
          Kernel repo: $KERNEL_REPO
          Kernel branch: $KERNEL_BRANCH
          Build: RubyxLabs AOSP + DroidSpaces Enhanced (Linux 4.19)
          No KernelSU / RKSU / SuSFS patches added
          Clang: $CLANG_VERSION $CLANG_COMMIT
          Created UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sed -i 's/^[[:space:]]*//' "$AK/build-manifest-droidspaces-aosp.txt"

          find "$AK" -maxdepth 4 -type f -printf '%p %s bytes\n' | sort | tee ../artifacts/logs/anykernel-final-tree.log
          test -f "$AK/Image.gz" || test -f "$AK/Image.gz-dtb"

          ZIP_NAME="Rubyx-${DEVICE_CODENAME}-${OUTPUT_SUFFIX}-$(date -u +%Y%m%d-%H%M%S).zip"
          (cd "$AK" && zip -r9 "../../artifacts/zips/$ZIP_NAME" .)
          sha256sum "../../artifacts/zips/$ZIP_NAME" | tee "../../artifacts/logs/$ZIP_NAME.sha256"
          ls -lah "../../artifacts/zips/$ZIP_NAME" | tee ../artifacts/logs/zips.log
          
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "zip_path=artifacts/zips/${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rubyx-ds-${{ github.run_number }}
          name: "🤖 Rubyx AOSP + DroidSpaces Enhanced — Build #${{ github.run_number }}"
          files: ${{ env.zip_path }}
          body: |
            ## 🤖 Rubyx Kernel — AOSP + DroidSpaces Enhanced

            ### 🔧 What's included
            - **Base:** RubyxLabs AOSP kernel (Xiaomi ruby/MT6877, Linux 4.19.x)
            - **DroidSpaces Enhanced:** Full container runtime + CPUSet + I/O throttling + bandwidth control
            - **No KSU:** No KernelSU, RKSU, SuSFS, or root patches
            - **Clean:** Pure AOSP + DroidSpaces

            ### 📋 Build Info
            - **Repo:** `${{ github.event.inputs.kernel_repo }}`
            - **Branch:** `${{ github.event.inputs.kernel_branch }}`
            - **Defconfig:** `${{ github.event.inputs.defconfig }}`
            - **Device:** ruby (Redmi Note 12 Pro 5G)
            - **Suffix:** `${{ github.event.inputs.output_suffix }}`
            - **Clang:** `${{ env.CLANG_VERSION }}`

            ### 📥 Install
            1. Reboot to recovery (TWRP/OrangeFox)
            2. Flash the ZIP
            3. Reboot

            ### ⚠️ Notes
            - For **AOSP/LineageOS** ROMs
            - This is **pure AOSP kernel + DroidSpaces Enhanced** — no root built-in
            - Use with Droidspaces [container environment](https://github.com/criollojoel10)

            > Built automatically via GitHub Actions from [kernel_xiaomi_mt6877](https://github.com/criollojoel10/kernel_xiaomi_mt6877)
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rubyx-${{ env.DEVICE_CODENAME }}-${{ github.event.inputs.output_suffix }}
          path: artifacts/
          retention-days: 7
