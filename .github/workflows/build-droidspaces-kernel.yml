name: Build DroidSpaces Stock Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - droidspaces-stock

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  AERON_REPO: XDL-MoonWake/aeron_kernel_xiaomi_ruby
  AERON_TAG: "1.0.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: droidspaces-stock
          fetch-depth: 1

      - name: Preflight checks
        shell: bash
        run: |
          set -euo pipefail

          echo "== Git HEAD =="
          git log --oneline -1 || true

          echo "== Required files =="
          test -f Makefile
          test -f configs/original_boot.config
          test -f configs/droidspaces_core.config

          echo "== Check unwanted KSU/SUSFS references =="
          set +e
          grep -R "CONFIG_KSU\|KernelSU\|SUSFS\|CONFIG_KSU_SUSFS" \
            Kconfig fs kernel security arch/arm64/configs 2>/dev/null > ksu-susfs-grep.txt
          GREP_RC="$?"
          set -e

          if [ "$GREP_RC" -eq 0 ]; then
            echo "WARNING: KSU/SUSFS references found:"
            head -80 ksu-susfs-grep.txt || true
          else
            echo "OK: no obvious KSU/SUSFS references found."
          fi

          echo "== Stock LTO/CFI state =="
          grep -E "CONFIG_LTO|CONFIG_THINLTO|CONFIG_CFI" configs/original_boot.config || true

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "== Disk before cleanup =="
          df -h || true

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true

          echo "== Disk after cleanup =="
          df -h || true

      - name: Ensure swap
        shell: bash
        run: |
          set -euo pipefail

          echo "== Memory and swap =="
          free -h || true
          swapon --show || true

          if swapon --show | grep -q '/swapfile'; then
            echo "/swapfile already active. Keeping existing swap."
          else
            SWAPFILE="/mnt/kernel-build-swapfile"
            echo "Creating $SWAPFILE"
            sudo rm -f "$SWAPFILE" || true
            sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192
            sudo chmod 600 "$SWAPFILE"
            sudo mkswap "$SWAPFILE"
            sudo swapon "$SWAPFILE"
          fi

          echo "== Memory after swap check =="
          free -h || true
          swapon --show || true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git \
            libssl-dev libelf-dev python3 python-is-python3 \
            wget curl patch zip unzip rsync jq file \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            lz4 zstd xz-utils ca-certificates

      - name: Download Aeron AnyKernel3 base
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reference/aeron
          mkdir -p installer_base

          echo "== Query Aeron release assets =="
          curl -L \
            "https://api.github.com/repos/${AERON_REPO}/releases/tags/${AERON_TAG}" \
            -o reference/aeron/release.json

          cat reference/aeron/release.json | jq '.tag_name, .name, [.assets[].name]'

          AERON_ZIP_URL="$(jq -r '.assets[] | select(.name | test("\\.zip$")) | .browser_download_url' reference/aeron/release.json | head -1)"

          if [ -z "$AERON_ZIP_URL" ] || [ "$AERON_ZIP_URL" = "null" ]; then
            echo "ERROR: No zip asset found in Aeron release"
            exit 1
          fi

          echo "AERON_ZIP_URL=$AERON_ZIP_URL" | tee reference/aeron/aeron-url.txt

          wget -O reference/aeron/aeron.zip "$AERON_ZIP_URL"

          echo "== Aeron zip info =="
          ls -lh reference/aeron/aeron.zip
          sha256sum reference/aeron/aeron.zip | tee reference/aeron/aeron-zip.sha256

          unzip -q reference/aeron/aeron.zip -d reference/aeron/unpacked

          echo "== Aeron file list =="
          find reference/aeron/unpacked -maxdepth 5 -type f | sort | tee reference/aeron/aeron-files.txt

          echo "== Extract minimal AnyKernel3 base =="
          AK3_CORE="$(find reference/aeron/unpacked -type f -path "*/tools/ak3-core.sh" | head -1 || true)"
          MAGISKBOOT="$(find reference/aeron/unpacked -type f -path "*/tools/magiskboot" | head -1 || true)"
          BUSYBOX="$(find reference/aeron/unpacked -type f -path "*/tools/busybox" | head -1 || true)"
          UPDATE_BINARY="$(find reference/aeron/unpacked -type f -path "*/META-INF/com/google/android/update-binary" | head -1 || true)"
          UPDATER_SCRIPT="$(find reference/aeron/unpacked -type f -path "*/META-INF/com/google/android/updater-script" | head -1 || true)"

          test -f "$AK3_CORE"
          test -f "$MAGISKBOOT"
          test -f "$BUSYBOX"
          test -f "$UPDATE_BINARY"
          test -f "$UPDATER_SCRIPT"

          mkdir -p installer_base/tools
          mkdir -p installer_base/META-INF/com/google/android
          mkdir -p installer_base/ramdisk
          mkdir -p installer_base/patch
          mkdir -p installer_base/modules/system/lib/modules

          cp "$AK3_CORE" installer_base/tools/ak3-core.sh
          cp "$MAGISKBOOT" installer_base/tools/magiskboot
          cp "$BUSYBOX" installer_base/tools/busybox
          cp "$UPDATE_BINARY" installer_base/META-INF/com/google/android/update-binary
          cp "$UPDATER_SCRIPT" installer_base/META-INF/com/google/android/updater-script

          touch installer_base/ramdisk/placeholder
          touch installer_base/patch/placeholder
          touch installer_base/modules/system/lib/modules/placeholder

          chmod +x installer_base/tools/ak3-core.sh || true
          chmod +x installer_base/tools/magiskboot || true
          chmod +x installer_base/tools/busybox || true
          chmod +x installer_base/META-INF/com/google/android/update-binary || true

          echo "== Minimal installer_base =="
          find installer_base -maxdepth 6 -type f -print -exec ls -lh {} \; | tee reference/aeron/installer-base-files.txt

      - name: Install official AOSP Clang r563880
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p toolchains

          CLANG_DIR="$PWD/toolchains/clang-aosp-21"
          AOSP_CLANG_REPO="$PWD/toolchains/aosp-clang-repo"
          AOSP_CLANG_COMMIT="6f88d37dd82ba741ca279539d44bb7da27ab1844"
          AOSP_CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"

          rm -rf "$CLANG_DIR" "$AOSP_CLANG_REPO"
          mkdir -p "$AOSP_CLANG_REPO"

          echo "Repo: $AOSP_CLANG_URL"
          echo "Commit: $AOSP_CLANG_COMMIT"
          echo "Path: clang-r563880"

          cd "$AOSP_CLANG_REPO"

          git init
          git remote add origin "$AOSP_CLANG_URL"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone true
          git sparse-checkout init --cone
          git sparse-checkout set clang-r563880

          FETCH_OK=0
          for i in 1 2 3; do
            echo "Fetch attempt $i/3"
            if git fetch --depth=1 --filter=blob:none origin "$AOSP_CLANG_COMMIT"; then
              FETCH_OK=1
              break
            fi
            sleep 10
          done

          if [ "$FETCH_OK" -ne 1 ]; then
            echo "ERROR: Failed to fetch AOSP clang commit"
            exit 1
          fi

          git checkout FETCH_HEAD

          cd "$GITHUB_WORKSPACE"

          if [ ! -d "$AOSP_CLANG_REPO/clang-r563880" ]; then
            echo "ERROR: clang-r563880 directory was not checked out"
            find "$AOSP_CLANG_REPO" -maxdepth 3 -type d | sort || true
            exit 1
          fi

          mv "$AOSP_CLANG_REPO/clang-r563880" "$CLANG_DIR"

          export PATH="$CLANG_DIR/bin:$PATH"

          echo "== Toolchain check =="
          which clang
          clang --version
          which ld.lld
          ld.lld --version
          which llvm-ar
          llvm-ar --version | head -1 || true

          clang --version | tee clang-version.txt

          if ! clang --version | grep -q "21.0.0"; then
            echo "ERROR: Expected clang 21.0.0"
            exit 1
          fi

          if ! clang --version | grep -qi "Android"; then
            echo "ERROR: Expected Android/AOSP clang, not system clang"
            exit 1
          fi

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Patch unsupported Clang warning flags
        shell: bash
        run: |
          set -euo pipefail

          echo "== Search unsupported warning flags before patch =="
          grep -RIn \
            -e "default-const-init-var-unsafe" \
            --exclude-dir=.git \
            --exclude-dir=out \
            . | tee unsupported-warning-flags-before.txt || true

          echo "== Remove unsupported warning flags =="
          while IFS= read -r -d '' f; do
            perl -0pi -e 's/\s*-Werror=default-const-init-var-unsafe//g;
                         s/\s*-Wno-error=default-const-init-var-unsafe//g;
                         s/\s*-Wdefault-const-init-var-unsafe//g;
                         s/\s*-Wno-default-const-init-var-unsafe//g;' "$f"
          done < <(
            grep -RIlZ \
              -e "default-const-init-var-unsafe" \
              --exclude-dir=.git \
              --exclude-dir=out \
              . || true
          )

          echo "== Search unsupported warning flags after patch =="
          grep -RIn \
            -e "default-const-init-var-unsafe" \
            --exclude-dir=.git \
            --exclude-dir=out \
            . | tee unsupported-warning-flags-after.txt || true

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${CLANG_DIR}/bin:$PATH"

          mkdir -p "${OUT_DIR}"

          MAKE_COMMON=(
            O="${OUT_DIR}"
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
          )

          echo "== Use original_boot.config as base =="
          cp configs/original_boot.config "${OUT_DIR}/.config"

          echo "== Apply Droidspaces core fragment =="
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs || true)"
            [ -z "$line" ] && continue

            if echo "$line" | grep -qE '^CONFIG_[A-Za-z0-9_]+=y$'; then
              cfg="${line%%=*}"
              scripts/config --file "${OUT_DIR}/.config" --enable "${cfg#CONFIG_}" || true
            elif echo "$line" | grep -qE '^# CONFIG_[A-Za-z0-9_]+ is not set$'; then
              cfg="$(echo "$line" | sed -E 's/^# (CONFIG_[A-Za-z0-9_]+) is not set$/\1/')"
              scripts/config --file "${OUT_DIR}/.config" --disable "${cfg#CONFIG_}" || true
            fi
          done < configs/droidspaces_core.config

          echo "== Force clean options =="
          scripts/config --file "${OUT_DIR}/.config" --disable KSU || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_SUSFS || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_WITH_KPROBES || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_KPROBES_HOOK || true

          scripts/config --file "${OUT_DIR}/.config" --disable BUILD_ARM64_APPENDED_DTB_IMAGE || true
          scripts/config --file "${OUT_DIR}/.config" --disable BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES || true

          echo "== Preserve stock ThinLTO/CFI =="
          scripts/config --file "${OUT_DIR}/.config" --enable LTO || true
          scripts/config --file "${OUT_DIR}/.config" --enable LTO_CLANG || true
          scripts/config --file "${OUT_DIR}/.config" --enable THINLTO || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI_CLANG || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI_CLANG_SHADOW || true
          scripts/config --file "${OUT_DIR}/.config" --disable LTO_NONE || true
          scripts/config --file "${OUT_DIR}/.config" --disable CFI_PERMISSIVE || true

          echo "== Networking/container options =="
          scripts/config --file "${OUT_DIR}/.config" --disable NF_TABLES || true
          scripts/config --file "${OUT_DIR}/.config" --disable ANDROID_PARANOID_NETWORK || true

          echo "== First olddefconfig =="
          make "${MAKE_COMMON[@]}" olddefconfig < /dev/null 2>&1 | tee olddefconfig-pass1.log

          echo "== Re-force important options after olddefconfig =="
          scripts/config --file "${OUT_DIR}/.config" --enable IPC_NS || true
          scripts/config --file "${OUT_DIR}/.config" --enable DEVTMPFS || true
          scripts/config --file "${OUT_DIR}/.config" --enable SYSVIPC || true
          scripts/config --file "${OUT_DIR}/.config" --enable POSIX_MQUEUE || true
          scripts/config --file "${OUT_DIR}/.config" --enable CGROUP_DEVICE || true
          scripts/config --file "${OUT_DIR}/.config" --enable CGROUP_PIDS || true
          scripts/config --file "${OUT_DIR}/.config" --enable TMPFS_XATTR || true
          scripts/config --file "${OUT_DIR}/.config" --enable CGROUP_NET_PRIO || true
          scripts/config --file "${OUT_DIR}/.config" --enable NETFILTER_XT_MATCH_ADDRTYPE || true
          scripts/config --file "${OUT_DIR}/.config" --enable NETFILTER_XT_TARGET_MASQUERADE || true
          scripts/config --file "${OUT_DIR}/.config" --enable IP_NF_TARGET_MASQUERADE || true

          scripts/config --file "${OUT_DIR}/.config" --enable LTO || true
          scripts/config --file "${OUT_DIR}/.config" --enable LTO_CLANG || true
          scripts/config --file "${OUT_DIR}/.config" --enable THINLTO || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI_CLANG || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI_CLANG_SHADOW || true
          scripts/config --file "${OUT_DIR}/.config" --disable LTO_NONE || true
          scripts/config --file "${OUT_DIR}/.config" --disable CFI_PERMISSIVE || true

          scripts/config --file "${OUT_DIR}/.config" --disable ANDROID_PARANOID_NETWORK || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_SUSFS || true
          scripts/config --file "${OUT_DIR}/.config" --disable BUILD_ARM64_APPENDED_DTB_IMAGE || true
          scripts/config --file "${OUT_DIR}/.config" --disable BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES || true
          scripts/config --file "${OUT_DIR}/.config" --disable NF_TABLES || true

          echo "== Second olddefconfig =="
          make "${MAKE_COMMON[@]}" olddefconfig < /dev/null 2>&1 | tee olddefconfig-pass2.log

          cp "${OUT_DIR}/.config" final.config

          echo "== Final important config =="
          grep -E "CONFIG_LTO|CONFIG_THINLTO|CONFIG_CFI|CONFIG_CC_IS_CLANG|CONFIG_LD_IS_LLD|CONFIG_IPC_NS|CONFIG_DEVTMPFS|CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_CGROUP_DEVICE|CONFIG_NF_TABLES|CONFIG_ANDROID_PARANOID_NETWORK|CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_BUILD_ARM64_APPENDED_DTB" final.config \
            | tee final-important-config.txt || true

      - name: Validate kernel config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="${OUT_DIR}/.config"
          : > config-check.txt
          FAILED=0

          REQUIRED="
          CONFIG_IPC_NS
          CONFIG_DEVTMPFS
          CONFIG_SYSVIPC
          CONFIG_POSIX_MQUEUE
          CONFIG_CGROUP_DEVICE
          CONFIG_NAMESPACES
          CONFIG_PID_NS
          CONFIG_UTS_NS
          CONFIG_NET_NS
          CONFIG_CGROUPS
          CONFIG_MEMCG
          CONFIG_SECCOMP
          CONFIG_SECCOMP_FILTER
          CONFIG_OVERLAY_FS
          CONFIG_VETH
          CONFIG_BRIDGE
          CONFIG_LTO
          CONFIG_LTO_CLANG
          CONFIG_THINLTO
          CONFIG_CFI
          CONFIG_CFI_CLANG
          CONFIG_CFI_CLANG_SHADOW
          "

          for cfg in $REQUIRED; do
            if grep -q "^${cfg}=y" "$CONFIG_FILE"; then
              echo "OK: ${cfg}=y" | tee -a config-check.txt
            else
              echo "MISSING: ${cfg}=y" | tee -a config-check.txt
              FAILED=1
            fi
          done

          if grep -q "^CONFIG_LTO_NONE=y" "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_LTO_NONE=y" | tee -a config-check.txt
            FAILED=1
          else
            echo "OK: CONFIG_LTO_NONE not enabled" | tee -a config-check.txt
          fi

          if grep -Eq "^CONFIG_KSU=|^CONFIG_KSU_SUSFS=" "$CONFIG_FILE"; then
            echo "ERROR: KSU/SUSFS enabled" | tee -a config-check.txt
            grep -E "^CONFIG_KSU=|^CONFIG_KSU_SUSFS=" "$CONFIG_FILE" | tee -a config-check.txt
            FAILED=1
          else
            echo "OK: KSU/SUSFS not enabled" | tee -a config-check.txt
          fi

          if grep -q "^CONFIG_ANDROID_PARANOID_NETWORK=y" "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_ANDROID_PARANOID_NETWORK=y" | tee -a config-check.txt
            FAILED=1
          else
            echo "OK: CONFIG_ANDROID_PARANOID_NETWORK disabled/absent" | tee -a config-check.txt
          fi

          if grep -q "^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" | tee -a config-check.txt
            FAILED=1
          else
            echo "OK: CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE not enabled" | tee -a config-check.txt
          fi

          echo "== Toolchain Kconfig =="
          grep -E "CONFIG_CC_IS_CLANG|CONFIG_LD_IS_LLD|CONFIG_CLANG_VERSION|CONFIG_LLD_VERSION" "$CONFIG_FILE" \
            | tee -a config-check.txt || true

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: config validation failed"
            exit 1
          fi

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${CLANG_DIR}/bin:$PATH"
          export LLVM_DISABLE_CRASH_REPORT=1

          echo "== Build toolchain =="
          which clang
          clang --version
          which ld.lld
          ld.lld --version

          echo "== Resources =="
          free -h || true
          df -h || true
          ulimit -n 8192 || true

          MAKE_JOBS="4"

          echo "== Build with -j${MAKE_JOBS} =="

          make O="${OUT_DIR}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"${MAKE_JOBS}" \
            Image.gz dtbs 2>&1 | tee build.log

      - name: Collect build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/logs
          mkdir -p artifacts/kernel

          cp -f clang-version.txt artifacts/logs/ || true
          cp -f final.config artifacts/logs/ || true
          cp -f final-important-config.txt artifacts/logs/ || true
          cp -f config-check.txt artifacts/logs/ || true
          cp -f olddefconfig-pass1.log artifacts/logs/ || true
          cp -f olddefconfig-pass2.log artifacts/logs/ || true
          cp -f build.log artifacts/logs/ || true
          cp -f unsupported-warning-flags-before.txt artifacts/logs/ || true
          cp -f unsupported-warning-flags-after.txt artifacts/logs/ || true
          cp -f ksu-susfs-grep.txt artifacts/logs/ || true

          echo "== Find kernel images =="
          find "${OUT_DIR}" -type f \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" -o -name "*.dtb" \) \
            -print | sort | tee artifacts/logs/kernel-output-files.txt || true

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz" artifacts/kernel/Image.gz
          fi

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" artifacts/kernel/Image
          fi

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" artifacts/kernel/Image.gz-dtb
          fi

          find "${OUT_DIR}/arch/arm64/boot/dts" -type f -name "*.dtb" -exec cp {} artifacts/kernel/ \; 2>/dev/null || true

      - name: Package AnyKernel3 zip
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f artifacts/kernel/Image.gz ] && [ ! -f artifacts/kernel/Image.gz-dtb ]; then
            echo "ERROR: No kernel Image.gz or Image.gz-dtb found. Build probably failed."
            exit 1
          fi

          rm -rf package
          cp -a installer_base package

          if [ -f artifacts/kernel/Image.gz-dtb ]; then
            cp artifacts/kernel/Image.gz-dtb package/Image.gz-dtb
          elif [ -f artifacts/kernel/Image.gz ]; then
            cp artifacts/kernel/Image.gz package/Image.gz
          fi

          mkdir -p package/dtbs
          cp artifacts/kernel/*.dtb package/dtbs/ 2>/dev/null || true

          cd package
          zip -r9 "../rubyx-droidspaces-aospclang-anykernel.zip" ./*
          cd ..

          ls -lh rubyx-droidspaces-aospclang-anykernel.zip
          sha256sum rubyx-droidspaces-aospclang-anykernel.zip | tee rubyx-droidspaces-aospclang-anykernel.zip.sha256

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubyx-droidspaces-build-logs
          path: |
            artifacts/logs/**
            reference/aeron/*.txt
            reference/aeron/*.sha256
            reference/aeron/release.json
          if-no-files-found: ignore

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: rubyx-droidspaces-aospclang-anykernel
          path: |
            rubyx-droidspaces-aospclang-anykernel.zip
            rubyx-droidspaces-aospclang-anykernel.zip.sha256
          if-no-files-found: error
