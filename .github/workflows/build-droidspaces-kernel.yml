name: Build Rubyx Droidspaces Kernel Image

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel branch/ref"
        required: true
        default: "droidspaces-stock"
      llvm_version:
        description: "LLVM/Clang version"
        required: true
        default: "21"
      droidspaces_ref:
        description: "Droidspaces branch/tag/commit for patches"
        required: true
        default: "main"
      build_variant:
        description: "Build variant"
        required: true
        default: "core"
        type: choice
        options:
          - core
          - official-mandatory

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_ref }}
          fetch-depth: 1

      - name: Source sanity check
        shell: bash
        run: |
          set -euo pipefail

          echo "== Git HEAD =="
          git log --oneline -1 || true

          echo "== Required files =="
          test -f Makefile
          test -f configs/original_boot.config
          test -f configs/droidspaces_core.config

          echo "== Check source tree for unwanted KSU/SUSFS references =="
          if grep -R "CONFIG_KSU\|KernelSU\|SUSFS\|CONFIG_KSU_SUSFS" \
            Kconfig fs kernel security arch/arm64/configs 2>/dev/null | head -80; then
            echo "WARNING: KSU/SUSFS references found in tree. Review source if you want 100% clean."
          else
            echo "OK: no obvious KSU/SUSFS references found."
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git \
            libssl-dev libelf-dev python3 python-is-python3 \
            wget curl patch zip unzip rsync \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            lz4 zstd xz-utils ca-certificates gnupg software-properties-common

      - name: Install LLVM/Clang
        shell: bash
        run: |
          set -euo pipefail

          LLVM_VERSION="${{ inputs.llvm_version }}"

          wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_VERSION}"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-"${LLVM_VERSION}" \
            lld-"${LLVM_VERSION}" \
            llvm-"${LLVM_VERSION}" \
            llvm-"${LLVM_VERSION}"-tools

          echo "== Toolchain check =="
          /usr/lib/llvm-"${LLVM_VERSION}"/bin/clang --version
          /usr/lib/llvm-"${LLVM_VERSION}"/bin/ld.lld --version
          /usr/lib/llvm-"${LLVM_VERSION}"/bin/llvm-ar --version | head -1

      - name: Checkout Droidspaces for non-GKI patches
        uses: actions/checkout@v4
        with:
          repository: ravindu644/Droidspaces-OSS
          ref: ${{ inputs.droidspaces_ref }}
          path: Droidspaces-OSS
          fetch-depth: 1

      - name: Apply Droidspaces non-GKI patches safely
        shell: bash
        run: |
          set -euo pipefail

          PATCH_DIR="Droidspaces-OSS/Documentation/resources/kernel-patches/non-GKI"

          echo "== Droidspaces commit =="
          git -C Droidspaces-OSS log --oneline -1 | tee droidspaces-ref.txt

          echo "== Droidspaces patches =="
          find "$PATCH_DIR" -type f -name "*.patch" -print | sort | tee patches-list.txt

          echo "== Applying patches safely =="
          : > patch_apply.log

          while IFS= read -r patch_file; do
            echo "---- ${patch_file} ----" | tee -a patch_apply.log

            # Detect target files from patch
            mapfile -t targets < <(
              grep -E '^\+\+\+ b/|^--- a/' "$patch_file" \
                | sed -E 's#^\+\+\+ b/##; s#^--- a/##' \
                | grep -v '^/dev/null$' \
                | sort -u
            )

            missing_count=0
            existing_count=0

            for target in "${targets[@]}"; do
              if [ -f "$target" ]; then
                existing_count=$((existing_count + 1))
              else
                missing_count=$((missing_count + 1))
                echo "Target missing: $target" | tee -a patch_apply.log
              fi
            done

            # If all targets are missing, skip as N/A.
            # This is expected for xt_qtaguid on trees that don't ship that file.
            if [ "${existing_count}" -eq 0 ]; then
              echo "SKIP: no target files exist for this patch. Marking as N/A." | tee -a patch_apply.log
              continue
            fi

            if patch --dry-run -p1 < "$patch_file" > /tmp/patch_dryrun.log 2>&1; then
              patch -p1 < "$patch_file" 2>&1 | tee -a patch_apply.log
              continue
            fi

            echo "Dry-run failed. Checking if already applied..." | tee -a patch_apply.log

            if patch --reverse --dry-run -p1 < "$patch_file" > /tmp/patch_reverse.log 2>&1; then
              echo "Already applied: ${patch_file}" | tee -a patch_apply.log
              continue
            fi

            echo "ERROR: patch failed and is not already applied: ${patch_file}" | tee -a patch_apply.log
            echo "== dry-run log =="
            cat /tmp/patch_dryrun.log
            echo "== reverse dry-run log =="
            cat /tmp/patch_reverse.log
            exit 1
          done < <(find "$PATCH_DIR" -type f -name "*.patch" | sort)

          if find . -name "*.rej" | grep -q .; then
            echo "ERROR: patch rejects found"
            find . -name "*.rej" -print
            exit 1
          fi

      - name: Create optional official mandatory fragment
        shell: bash
        run: |
          set -euo pipefail

          cat > configs/droidspaces_official_mandatory.config <<'EOF'
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y

          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y

          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y

          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y

          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF

      - name: Configure kernel from extracted stock config
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${OUT_DIR}"

          echo "== Use original_boot.config as base =="
          cp configs/original_boot.config "${OUT_DIR}/.config"

          if [ "${{ inputs.build_variant }}" = "official-mandatory" ]; then
            FRAGMENT="configs/droidspaces_official_mandatory.config"
          else
            FRAGMENT="configs/droidspaces_core.config"
          fi

          echo "Using fragment: ${FRAGMENT}"

          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs || true)"

            [ -z "$line" ] && continue

            if echo "$line" | grep -qE '^CONFIG_[A-Za-z0-9_]+=y$'; then
              cfg="${line%%=*}"
              scripts/config --file "${OUT_DIR}/.config" --enable "${cfg#CONFIG_}" || true
            elif echo "$line" | grep -qE '^# CONFIG_[A-Za-z0-9_]+ is not set$'; then
              cfg="$(echo "$line" | sed -E 's/^# (CONFIG_[A-Za-z0-9_]+) is not set$/\1/')"
              scripts/config --file "${OUT_DIR}/.config" --disable "${cfg#CONFIG_}" || true
            fi
          done < "$FRAGMENT"

          echo "== Force clean: disable KSU/SUSFS if symbols exist =="
          scripts/config --file "${OUT_DIR}/.config" --disable KSU || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_SUSFS || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_WITH_KPROBES || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_KPROBES_HOOK || true

          echo "== Important: keep boot.img DTB separated =="
          scripts/config --file "${OUT_DIR}/.config" --disable BUILD_ARM64_APPENDED_DTB_IMAGE || true
          scripts/config --file "${OUT_DIR}/.config" --disable BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES || true

          export PATH="/usr/lib/llvm-${{ inputs.llvm_version }}/bin:${PATH}"

          make O="${OUT_DIR}" ARCH=arm64 olddefconfig 2>&1 | tee olddefconfig.log

          cp "${OUT_DIR}/.config" final.config

      - name: Validate final config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="${OUT_DIR}/.config"
          : > config-check.txt

          echo "== Droidspaces required/core config check ==" | tee -a config-check.txt

          REQUIRED="
          CONFIG_IPC_NS
          CONFIG_DEVTMPFS
          CONFIG_SYSVIPC
          CONFIG_POSIX_MQUEUE
          CONFIG_CGROUP_DEVICE
          CONFIG_NAMESPACES
          CONFIG_PID_NS
          CONFIG_UTS_NS
          CONFIG_NET_NS
          CONFIG_CGROUPS
          CONFIG_MEMCG
          CONFIG_SECCOMP
          CONFIG_SECCOMP_FILTER
          CONFIG_OVERLAY_FS
          CONFIG_VETH
          CONFIG_BRIDGE
          "

          FAILED=0

          for cfg in $REQUIRED; do
            if grep -q "^${cfg}=y" "$CONFIG_FILE"; then
              echo "OK: ${cfg}=y" | tee -a config-check.txt
            else
              echo "MISSING: ${cfg}=y" | tee -a config-check.txt
              FAILED=1
            fi
          done

          echo "" | tee -a config-check.txt
          echo "== Clean kernel check ==" | tee -a config-check.txt

          if grep -Eq "^CONFIG_KSU=|^CONFIG_KSU_SUSFS=" "$CONFIG_FILE"; then
            echo "ERROR: KSU/SUSFS enabled" | tee -a config-check.txt
            grep -E "^CONFIG_KSU=|^CONFIG_KSU_SUSFS=" "$CONFIG_FILE" | tee -a config-check.txt
            FAILED=1
          else
            echo "OK: KSU/SUSFS not enabled" | tee -a config-check.txt
          fi

          if grep -q "^CONFIG_ANDROID_PARANOID_NETWORK=y" "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_ANDROID_PARANOID_NETWORK=y" | tee -a config-check.txt
            FAILED=1
          else
            echo "OK: CONFIG_ANDROID_PARANOID_NETWORK disabled/absent" | tee -a config-check.txt
          fi

          echo "" | tee -a config-check.txt
          echo "== DTB mode check ==" | tee -a config-check.txt
          grep -E "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES" "$CONFIG_FILE" | tee -a config-check.txt || true

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: final config validation failed"
            exit 1
          fi

      - name: Build kernel Image
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-${{ inputs.llvm_version }}/bin:${PATH}"

          echo "== Toolchain actually used =="
          which clang
          clang --version
          which ld.lld
          ld.lld --version

          make O="${OUT_DIR}" \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" 2>&1 | tee build.log

          echo "== Produced boot files =="
          find "${OUT_DIR}/arch/arm64/boot" -maxdepth 4 -type f \
            \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" -o -name "*.dtb" -o -name "*.dtbo" \) \
            -print -exec ls -lh {} \;

          test -f "${OUT_DIR}/arch/arm64/boot/Image"

          cp "${OUT_DIR}/arch/arm64/boot/Image" ./Image

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz" ./Image.gz
          fi

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ./Image.gz-dtb
          fi

          sha256sum Image* | tee image-sha256.txt

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rubyx-droidspaces-kernel-${{ inputs.build_variant }}
          path: |
            Image
            Image.gz
            Image.gz-dtb
            final.config
            config-check.txt
            build.log
            olddefconfig.log
            patch_apply.log
            patches-list.txt
            droidspaces-ref.txt
            image-sha256.txt
          if-no-files-found: ignore

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rubyx-droidspaces-debug-failure
          path: |
            *.log
            *.txt
            final.config
            out/.config
          if-no-files-found: ignore
