name: Build Droidspaces AnyKernel Zip From Aeron Base

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel branch/ref"
        required: true
        default: "droidspaces-stock"

      package_format:
        description: "Kernel file inside AnyKernel zip"
        required: true
        default: "Image.gz"
        type: choice
        options:
          - Image.gz
          - Image.gz-dtb

      enable_nftables:
        description: "Enable CONFIG_NF_TABLES"
        required: true
        default: false
        type: boolean

      jobs:
        description: "Make parallel jobs"
        required: true
        default: "4"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out
      AERON_REPO: XDL-MoonWake/aeron_kernel_xiaomi_ruby
      AERON_TAG: 1.0.2
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_ref }}
          fetch-depth: 1

      - name: Source sanity check
        shell: bash
        run: |
          set -euo pipefail

          echo "== Git HEAD =="
          git log --oneline -1 || true

          echo "== Required config files =="
          test -f Makefile
          test -f configs/original_boot.config
          test -f configs/droidspaces_core.config

          echo "== Check unwanted KSU/SUSFS references in our source =="
          if grep -R "CONFIG_KSU\|KernelSU\|SUSFS\|CONFIG_KSU_SUSFS" \
            Kconfig fs kernel security arch/arm64/configs 2>/dev/null | head -80; then
            echo "WARNING: KSU/SUSFS references found in source tree."
            echo "Review this if this branch must be 100% clean."
          else
            echo "OK: no obvious KSU/SUSFS references found."
          fi

          echo "== Stock LTO/CFI state from original_boot.config =="
          grep -E "CONFIG_LTO|CONFIG_THINLTO|CONFIG_CFI" configs/original_boot.config || true

      - name: Cleanup runner disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "== Disk before cleanup =="
          df -h || true

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true

          echo "== Disk after cleanup =="
          df -h || true

      - name: Check memory and swap
        shell: bash
        run: |
          set -euo pipefail

          echo "== Memory and swap =="
          free -h || true
          swapon --show || true

          if swapon --show | grep -q '/swapfile'; then
            echo "/swapfile already active. Keeping existing swap."
          else
            echo "No /swapfile active. Creating /mnt/kernel-build-swapfile."
            SWAPFILE="/mnt/kernel-build-swapfile"

            if swapon --show | grep -q "$SWAPFILE"; then
              echo "$SWAPFILE already active."
            else
              sudo rm -f "$SWAPFILE" || true
              sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192
              sudo chmod 600 "$SWAPFILE"
              sudo mkswap "$SWAPFILE"
              sudo swapon "$SWAPFILE"
            fi
          fi

          echo "== Memory after swap check =="
          free -h || true
          swapon --show || true

      - name: Install base dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git \
            libssl-dev libelf-dev python3 python-is-python3 \
            wget curl patch zip unzip rsync jq file \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            lz4 zstd xz-utils ca-certificates

      - name: Download Aeron Phoenix installer base
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reference/aeron
          mkdir -p installer_base

          echo "== Query Aeron release assets =="
          curl -L \
            "https://api.github.com/repos/${AERON_REPO}/releases/tags/${AERON_TAG}" \
            -o reference/aeron/release.json

          cat reference/aeron/release.json | jq '.tag_name, .name, [.assets[].name]'

          AERON_ZIP_URL="$(jq -r '.assets[] | select(.name | test("\\.zip$")) | .browser_download_url' reference/aeron/release.json | head -1)"

          if [ -z "$AERON_ZIP_URL" ] || [ "$AERON_ZIP_URL" = "null" ]; then
            echo "ERROR: No zip asset found in Aeron release"
            exit 1
          fi

          echo "AERON_ZIP_URL=$AERON_ZIP_URL" | tee reference/aeron/aeron-url.txt

          wget -O reference/aeron/aeron.zip "$AERON_ZIP_URL"

          echo "== Aeron zip info =="
          ls -lh reference/aeron/aeron.zip
          sha256sum reference/aeron/aeron.zip | tee reference/aeron/aeron-zip.sha256

          unzip -q reference/aeron/aeron.zip -d reference/aeron/unpacked

          echo "== Aeron file list =="
          find reference/aeron/unpacked -maxdepth 5 -type f | sort | tee reference/aeron/aeron-files.txt

          echo "== Extract minimal AnyKernel3 base from Aeron =="
          AK3_CORE="$(find reference/aeron/unpacked -type f -path "*/tools/ak3-core.sh" | head -1 || true)"
          MAGISKBOOT="$(find reference/aeron/unpacked -type f -path "*/tools/magiskboot" | head -1 || true)"
          BUSYBOX="$(find reference/aeron/unpacked -type f -path "*/tools/busybox" | head -1 || true)"
          UPDATE_BINARY="$(find reference/aeron/unpacked -type f -path "*/META-INF/com/google/android/update-binary" | head -1 || true)"
          UPDATER_SCRIPT="$(find reference/aeron/unpacked -type f -path "*/META-INF/com/google/android/updater-script" | head -1 || true)"

          test -f "$AK3_CORE"
          test -f "$MAGISKBOOT"
          test -f "$BUSYBOX"
          test -f "$UPDATE_BINARY"
          test -f "$UPDATER_SCRIPT"

          mkdir -p installer_base/tools
          mkdir -p installer_base/META-INF/com/google/android
          mkdir -p installer_base/ramdisk
          mkdir -p installer_base/patch
          mkdir -p installer_base/modules/system/lib/modules

          cp "$AK3_CORE" installer_base/tools/ak3-core.sh
          cp "$MAGISKBOOT" installer_base/tools/magiskboot
          cp "$BUSYBOX" installer_base/tools/busybox
          cp "$UPDATE_BINARY" installer_base/META-INF/com/google/android/update-binary
          cp "$UPDATER_SCRIPT" installer_base/META-INF/com/google/android/updater-script

          touch installer_base/ramdisk/placeholder
          touch installer_base/patch/placeholder
          touch installer_base/modules/system/lib/modules/placeholder

          chmod +x installer_base/tools/ak3-core.sh || true
          chmod +x installer_base/tools/magiskboot || true
          chmod +x installer_base/tools/busybox || true
          chmod +x installer_base/META-INF/com/google/android/update-binary || true

          echo "== Minimal installer_base =="
          find installer_base -maxdepth 6 -type f -print -exec ls -lh {} \; | tee reference/aeron/installer-base-files.txt

      - name: Install AOSP Clang 21.0.0 r563880
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p toolchains

          echo "== Download AOSP Clang 21.0.0 r563880 prebuilt =="
          CLANG_DIR="$PWD/toolchains/clang-aosp-21"

          rm -rf "$CLANG_DIR"

          URLS=(
            "https://github.com/XDL-MoonWake/linux-x86-clang-21.0.0-r563880/archive/refs/heads/main.tar.gz"
            "https://github.com/DPR-MoonWake/linux-x86-clang-21.0.0-r563880/archive/refs/heads/main.tar.gz"
          )

          OK=0

          for URL in "${URLS[@]}"; do
            echo "Trying: $URL"

            rm -rf "$CLANG_DIR" toolchains/clang-download.tar.gz toolchains/clang-extract
            mkdir -p toolchains

            if curl -L --fail --retry 3 --retry-delay 5 "$URL" -o toolchains/clang-download.tar.gz; then
              mkdir -p toolchains/clang-extract

              if tar -xzf toolchains/clang-download.tar.gz -C toolchains/clang-extract --strip-components=1; then
                mv toolchains/clang-extract "$CLANG_DIR"
                OK=1
                break
              fi
            fi
          done

          if [ "$OK" -ne 1 ]; then
            echo "ERROR: Could not download AOSP Clang r563880 from any mirror."
            exit 1
          fi

          export PATH="$CLANG_DIR/bin:$PATH"

          echo "== Toolchain files =="
          ls -lah "$CLANG_DIR" | head
          ls -lah "$CLANG_DIR/bin" | head

          echo "== Toolchain check =="
          which clang
          clang --version
          which ld.lld
          ld.lld --version
          which llvm-ar
          llvm-ar --version | head -1 || true

          echo "== Save toolchain path =="
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Configure kernel from stock config with Droidspaces core
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${CLANG_DIR}/bin:$PATH"

          mkdir -p "${OUT_DIR}"

          MAKE_COMMON=(
            O="${OUT_DIR}"
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
          )

          echo "== Use original_boot.config as base =="
          cp configs/original_boot.config "${OUT_DIR}/.config"

          echo "== Apply Droidspaces core fragment =="
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs || true)"
            [ -z "$line" ] && continue

            if echo "$line" | grep -qE '^CONFIG_[A-Za-z0-9_]+=y$'; then
              cfg="${line%%=*}"
              scripts/config --file "${OUT_DIR}/.config" --enable "${cfg#CONFIG_}" || true
            elif echo "$line" | grep -qE '^# CONFIG_[A-Za-z0-9_]+ is not set$'; then
              cfg="$(echo "$line" | sed -E 's/^# (CONFIG_[A-Za-z0-9_]+) is not set$/\1/')"
              scripts/config --file "${OUT_DIR}/.config" --disable "${cfg#CONFIG_}" || true
            fi
          done < configs/droidspaces_core.config

          echo "== Force clean: disable KSU/SUSFS =="
          scripts/config --file "${OUT_DIR}/.config" --disable KSU || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_SUSFS || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_WITH_KPROBES || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_KPROBES_HOOK || true

          echo "== Do not force appended DTB from Kconfig =="
          scripts/config --file "${OUT_DIR}/.config" --disable BUILD_ARM64_APPENDED_DTB_IMAGE || true
          scripts/config --file "${OUT_DIR}/.config" --disable BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES || true

          echo "== Preserve stock ThinLTO/CFI =="
          scripts/config --file "${OUT_DIR}/.config" --enable LTO || true
          scripts/config --file "${OUT_DIR}/.config" --enable LTO_CLANG || true
          scripts/config --file "${OUT_DIR}/.config" --enable THINLTO || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI_CLANG || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI_CLANG_SHADOW || true
          scripts/config --file "${OUT_DIR}/.config" --disable LTO_NONE || true
          scripts/config --file "${OUT_DIR}/.config" --disable CFI_PERMISSIVE || true

          echo "== Handle NF_TABLES =="
          if [ "${{ inputs.enable_nftables }}" = "true" ]; then
            scripts/config --file "${OUT_DIR}/.config" --enable NF_TABLES || true
          else
            scripts/config --file "${OUT_DIR}/.config" --disable NF_TABLES || true
          fi

          echo "== Disable Android paranoid network =="
          scripts/config --file "${OUT_DIR}/.config" --disable ANDROID_PARANOID_NETWORK || true

          echo "== First olddefconfig with AOSP Clang =="
          make "${MAKE_COMMON[@]}" olddefconfig < /dev/null 2>&1 | tee olddefconfig-pass1.log

          echo "== Re-force important options after olddefconfig =="
          scripts/config --file "${OUT_DIR}/.config" --enable IPC_NS || true
          scripts/config --file "${OUT_DIR}/.config" --enable DEVTMPFS || true
          scripts/config --file "${OUT_DIR}/.config" --enable SYSVIPC || true
          scripts/config --file "${OUT_DIR}/.config" --enable POSIX_MQUEUE || true
          scripts/config --file "${OUT_DIR}/.config" --enable CGROUP_DEVICE || true
          scripts/config --file "${OUT_DIR}/.config" --enable CGROUP_PIDS || true
          scripts/config --file "${OUT_DIR}/.config" --enable TMPFS_XATTR || true
          scripts/config --file "${OUT_DIR}/.config" --enable CGROUP_NET_PRIO || true
          scripts/config --file "${OUT_DIR}/.config" --enable NETFILTER_XT_MATCH_ADDRTYPE || true
          scripts/config --file "${OUT_DIR}/.config" --enable NETFILTER_XT_TARGET_MASQUERADE || true
          scripts/config --file "${OUT_DIR}/.config" --enable IP_NF_TARGET_MASQUERADE || true

          scripts/config --file "${OUT_DIR}/.config" --enable LTO || true
          scripts/config --file "${OUT_DIR}/.config" --enable LTO_CLANG || true
          scripts/config --file "${OUT_DIR}/.config" --enable THINLTO || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI_CLANG || true
          scripts/config --file "${OUT_DIR}/.config" --enable CFI_CLANG_SHADOW || true
          scripts/config --file "${OUT_DIR}/.config" --disable LTO_NONE || true
          scripts/config --file "${OUT_DIR}/.config" --disable CFI_PERMISSIVE || true

          scripts/config --file "${OUT_DIR}/.config" --disable ANDROID_PARANOID_NETWORK || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU || true
          scripts/config --file "${OUT_DIR}/.config" --disable KSU_SUSFS || true
          scripts/config --file "${OUT_DIR}/.config" --disable BUILD_ARM64_APPENDED_DTB_IMAGE || true
          scripts/config --file "${OUT_DIR}/.config" --disable BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES || true

          if [ "${{ inputs.enable_nftables }}" = "true" ]; then
            scripts/config --file "${OUT_DIR}/.config" --enable NF_TABLES || true
          else
            scripts/config --file "${OUT_DIR}/.config" --disable NF_TABLES || true
          fi

          echo "== Second olddefconfig with AOSP Clang =="
          make "${MAKE_COMMON[@]}" olddefconfig < /dev/null 2>&1 | tee olddefconfig-pass2.log

          cp "${OUT_DIR}/.config" final.config

          echo "== Final important config =="
          grep -E "CONFIG_LTO|CONFIG_THINLTO|CONFIG_CFI|CONFIG_CC_IS_CLANG|CONFIG_LD_IS_LLD|CONFIG_IPC_NS|CONFIG_DEVTMPFS|CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_CGROUP_DEVICE|CONFIG_NF_TABLES|CONFIG_ANDROID_PARANOID_NETWORK|CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_BUILD_ARM64_APPENDED_DTB" final.config \
            | tee final-important-config.txt || true

      - name: Validate final config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="${OUT_DIR}/.config"
          : > config-check.txt
          FAILED=0

          REQUIRED="
          CONFIG_IPC_NS
          CONFIG_DEVTMPFS
          CONFIG_SYSVIPC
          CONFIG_POSIX_MQUEUE
          CONFIG_CGROUP_DEVICE
          CONFIG_NAMESPACES
          CONFIG_PID_NS
          CONFIG_UTS_NS
          CONFIG_NET_NS
          CONFIG_CGROUPS
          CONFIG_MEMCG
          CONFIG_SECCOMP
          CONFIG_SECCOMP_FILTER
          CONFIG_OVERLAY_FS
          CONFIG_VETH
          CONFIG_BRIDGE
          CONFIG_LTO
          CONFIG_LTO_CLANG
          CONFIG_THINLTO
          CONFIG_CFI
          CONFIG_CFI_CLANG
          CONFIG_CFI_CLANG_SHADOW
          "

          for cfg in $REQUIRED; do
            if grep -q "^${cfg}=y" "$CONFIG_FILE"; then
              echo "OK: ${cfg}=y" | tee -a config-check.txt
            else
              echo "MISSING: ${cfg}=y" | tee -a config-check.txt
              FAILED=1
            fi
          done

          if grep -q "^CONFIG_LTO_NONE=y" "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_LTO_NONE=y" | tee -a config-check.txt
            FAILED=1
          else
            echo "OK: CONFIG_LTO_NONE not enabled" | tee -a config-check.txt
          fi

          if grep -Eq "^CONFIG_KSU=|^CONFIG_KSU_SUSFS=" "$CONFIG_FILE"; then
            echo "ERROR: KSU/SUSFS enabled" | tee -a config-check.txt
            grep -E "^CONFIG_KSU=|^CONFIG_KSU_SUSFS=" "$CONFIG_FILE" | tee -a config-check.txt
            FAILED=1
          else
            echo "OK: KSU/SUSFS not enabled" | tee -a config-check.txt
          fi

          if grep -q "^CONFIG_ANDROID_PARANOID_NETWORK=y" "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_ANDROID_PARANOID_NETWORK=y" | tee -a config-check.txt
            FAILED=1
          else
            echo "OK: CONFIG_ANDROID_PARANOID_NETWORK disabled/absent" | tee -a config-check.txt
          fi

          if grep -q "^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" | tee -a config-check.txt
            FAILED=1
          else
            echo "OK: CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE not enabled" | tee -a config-check.txt
          fi

          echo "== Toolchain Kconfig =="
          grep -E "CONFIG_CC_IS_CLANG|CONFIG_LD_IS_LLD|CONFIG_CLANG_VERSION|CONFIG_LLD_VERSION" "$CONFIG_FILE" | tee -a config-check.txt || true

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: config validation failed"
            exit 1
          fi

      - name: Build kernel with AOSP Clang
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${CLANG_DIR}/bin:$PATH"
          export LLVM_DISABLE_CRASH_REPORT=1

          echo "== Build toolchain =="
          which clang
          clang --version
          which ld.lld
          ld.lld --version

          echo "== Resources =="
          free -h || true
          df -h || true
          ulimit -n 8192 || true

          MAKE_JOBS="${{ inputs.jobs }}"

          echo "== Build with -j${MAKE_JOBS} =="
          set +e
          make O="${OUT_DIR}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error=default-const-init-var-unsafe -Wno-default-const-init-var-unsafe" \
            -j"${MAKE_JOBS}" 2>&1 | tee build.log
          BUILD_RC="${PIPESTATUS[0]}"
          set -e

          if grep -q "LLVM ERROR" build.log; then
            echo "ERROR: LLVM ERROR detected. Build is invalid."
            exit 1
          fi

          if grep -q "Broken pipe" build.log; then
            echo "ERROR: Broken pipe detected. Build is invalid."
            exit 1
          fi

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "ERROR: make failed with rc=$BUILD_RC"
            exit "$BUILD_RC"
          fi

      - name: Create kernel artifacts
        shell: bash
        run: |
          set -euo pipefail

          BOOT_DIR="${OUT_DIR}/arch/arm64/boot"
          DTS_DIR="${BOOT_DIR}/dts/mediatek"

          echo "== Produced boot files =="
          find "${BOOT_DIR}" -maxdepth 4 -type f \
            \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" -o -name "*.dtb" -o -name "*.dtbo" \) \
            -print -exec ls -lh {} \;

          test -f "${BOOT_DIR}/Image"

          if [ ! -f "${BOOT_DIR}/Image.gz" ]; then
            echo "Image.gz not found, compressing Image manually"
            gzip -c "${BOOT_DIR}/Image" > "${BOOT_DIR}/Image.gz"
          fi

          test -f "${BOOT_DIR}/Image.gz"

          DTB="$(find "${DTS_DIR}" -type f -name "mt6877*.dtb" | head -1 || true)"
          DTBO="$(find "${DTS_DIR}" -type f -name "ruby*.dtbo" | head -1 || true)"

          if [ -n "$DTB" ] && [ -f "$DTB" ]; then
            cp "$DTB" ./mt6877.dtb
          else
            echo "WARNING: mt6877*.dtb not found"
          fi

          if [ -n "$DTBO" ] && [ -f "$DTBO" ]; then
            cp "$DTBO" ./ruby.dtbo
          else
            echo "WARNING: ruby*.dtbo not found"
          fi

          cp "${BOOT_DIR}/Image" ./Image
          cp "${BOOT_DIR}/Image.gz" ./Image.gz

          if [ -f ./mt6877.dtb ] && [ -f ./ruby.dtbo ]; then
            cat ./Image.gz ./mt6877.dtb ./ruby.dtbo > ./Image.gz-dtb
          else
            echo "Image.gz-dtb not created because DTB/DTBO missing"
          fi

          echo "== Final kernel artifacts =="
          ls -lh Image Image.gz mt6877.dtb ruby.dtbo Image.gz-dtb 2>/dev/null || true
          sha256sum Image Image.gz mt6877.dtb ruby.dtbo Image.gz-dtb 2>/dev/null | tee image-sha256.txt || true

          echo "== Kernel strings =="
          strings Image | grep -Ei "Linux version|clang version|LLD|KernelSU|SUSFS|Aeron" | head -120 \
            | tee our-kernel-strings.txt || true

          if [ -f Image.gz-dtb ]; then
            strings Image.gz-dtb | grep -Ei "Linux version|clang version|LLD|KernelSU|SUSFS|Aeron" | head -120 \
              | tee our-imagegzdtb-strings.txt || true
          fi

      - name: Create AnyKernel3 zip
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_FORMAT="${{ inputs.package_format }}"

          echo "== Prepare installer_base =="
          rm -f installer_base/Image installer_base/Image.gz installer_base/Image.gz-dtb || true

          cat > installer_base/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Droidspaces Kernel Ruby
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; }

          attributes() {
            set_perm_recursive 0 0 755 644 $ramdisk/*;
            set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
          }

          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh && attributes;
          dump_boot;
          write_boot;
          EOF

          if [ "$PACKAGE_FORMAT" = "Image.gz-dtb" ]; then
            if [ ! -f Image.gz-dtb ]; then
              echo "ERROR: package_format is Image.gz-dtb but Image.gz-dtb does not exist"
              exit 1
            fi
            echo "Packaging Image.gz-dtb"
            cp Image.gz-dtb installer_base/Image.gz-dtb
          else
            echo "Packaging Image.gz"
            cp Image.gz installer_base/Image.gz
          fi

          chmod +x installer_base/tools/ak3-core.sh || true
          chmod +x installer_base/tools/busybox || true
          chmod +x installer_base/tools/magiskboot || true
          chmod +x installer_base/META-INF/com/google/android/update-binary || true

          ZIP_NAME="Rubyx-Droidspaces-AOSPClang-${PACKAGE_FORMAT}-${GITHUB_RUN_NUMBER}.zip"

          cd installer_base
          zip -r9 "../${ZIP_NAME}" . \
            -x ".git/*" \
            -x "*.bak"
          cd ..

          echo "== Zip info =="
          ls -lh "${ZIP_NAME}"
          unzip -l "${ZIP_NAME}" | tee anykernel-zip-list.txt
          sha256sum "${ZIP_NAME}" | tee anykernel-zip.sha256

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubyx-droidspaces-aospclang-anykernel
          path: |
            Image
            Image.gz
            Image.gz-dtb
            mt6877.dtb
            ruby.dtbo
            Rubyx-Droidspaces-AOSPClang-*.zip
            final.config
            config-check.txt
            final-important-config.txt
            olddefconfig-pass1.log
            olddefconfig-pass2.log
            build.log
