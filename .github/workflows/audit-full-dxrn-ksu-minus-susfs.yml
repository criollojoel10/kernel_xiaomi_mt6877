name: Audit Full DXRN KSU Minus SuSFS

"on":
  workflow_dispatch:
    inputs:
      dxrn_org:
        description: "Organización completa a auditar"
        required: true
        default: "DXRN-MoonWake"
        type: string
      base_repo:
        description: "Kernel base limpio para comparar"
        required: true
        default: "RubyxLabs/kernel_xiaomi_mt6877"
        type: string
      base_branch:
        description: "Branch base limpio"
        required: true
        default: "lineage-23.2"
        type: string
      output_suffix:
        description: "Sufijo del artifact"
        required: true
        default: "Full-KSU-minus-SuSFS-Audit"
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Study all DXRN KSU integration and isolate SuSFS
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Prepare audit environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace artifacts/logs artifacts/reports artifacts/raw artifacts/patches artifacts/branches
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl jq ripgrep zip file ca-certificates python3

      - name: Query every public DXRN repository
        shell: bash
        env:
          DXRN_ORG: ${{ github.event.inputs.dxrn_org }}
        run: |
          set -euo pipefail
          cd workspace
          : > ../artifacts/raw/org-repos.jsonl
          page=1
          while true; do
            curl -L --fail -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${DXRN_ORG}/repos?per_page=100&page=${page}" \
              -o "repos-page-${page}.json"
            count="$(jq 'length' "repos-page-${page}.json")"
            [ "$count" -gt 0 ] || break
            jq -c '.[]' "repos-page-${page}.json" >> ../artifacts/raw/org-repos.jsonl
            page=$((page + 1))
          done
          jq -r '[.name,.clone_url,.default_branch,.language,.updated_at,.fork] | @tsv' ../artifacts/raw/org-repos.jsonl \
            | sort | tee ../artifacts/reports/org-repos.tsv
          jq -r '.name' ../artifacts/raw/org-repos.jsonl | sort | tee ../artifacts/reports/org-repo-names.txt

      - name: Clone all default branches and relevant KSU branches
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          mkdir -p dxrn-default dxrn-branches
          : > ../artifacts/reports/selected-branches.tsv
          while IFS=$'\t' read -r name clone_url default_branch language updated_at fork; do
            echo "== default ${name}:${default_branch} ==" | tee -a ../artifacts/logs/clone.log
            git clone --depth 1 --filter=blob:none --branch "$default_branch" "$clone_url" "dxrn-default/$name" \
              2>&1 | tee -a ../artifacts/logs/clone.log || true

            echo "== branches for ${name} ==" | tee "../artifacts/branches/${name}-branches.txt"
            git ls-remote --heads "$clone_url" | awk '{print $2}' | sed 's#refs/heads/##' | sort \
              | tee -a "../artifacts/branches/${name}-branches.txt" || true

            if echo "$name" | grep -Eiq 'kernel|KernelSU|RKSU|Action|AnyKernel'; then
              branches="$(grep -Ei 'ksu|susfs|moon|aeron|lineage|main|master|next|suki|rksu' "../artifacts/branches/${name}-branches.txt" | head -n 10 || true)"
              [ -n "$branches" ] || branches="$default_branch"
              while read -r branch; do
                [ -n "$branch" ] || continue
                safe_branch="$(echo "$branch" | tr '/:@ ' '____')"
                dest="dxrn-branches/${name}__${safe_branch}"
                echo -e "${name}\t${branch}\t${dest}" | tee -a ../artifacts/reports/selected-branches.tsv
                git clone --depth 1 --filter=blob:none --branch "$branch" "$clone_url" "$dest" \
                  2>&1 | tee -a ../artifacts/logs/clone-branches.log || true
              done <<< "$branches"
            fi
          done < ../artifacts/reports/org-repos.tsv

      - name: Clone clean base for comparisons
        shell: bash
        env:
          BASE_REPO: ${{ github.event.inputs.base_repo }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch }}
        run: |
          set -euo pipefail
          cd workspace
          git clone --filter=blob:none --no-checkout "https://github.com/${BASE_REPO}.git" base-kernel
          cd base-kernel
          git fetch --depth 1 origin "$BASE_BRANCH"
          git checkout FETCH_HEAD
          git rev-parse HEAD | tee ../../artifacts/logs/base-commit.log
          git log --oneline -20 | tee ../../artifacts/logs/base-history.log

      - name: Full inventory without deleting context
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          SEARCH_ROOTS="dxrn-default dxrn-branches"
          rg -n --hidden --glob '!**/.git/**' \
            'KernelSU|KernelSU-Next|SukiSU|RKSU|KSU|ksu_|ksud|CONFIG_KSU|drivers/kernelsu|KernelSU/kernel|kernel/setup\.sh|manager|superuser|root' \
            $SEARCH_ROOTS | tee ../artifacts/reports/full-ksu-root-inventory.log || true
          rg -n --hidden --glob '!**/.git/**' \
            'SuSFS|SUSFS|susfs|sus_path|sus_mount|sus_su|KPM|KPatch|APatch|Magic Mount|hide_sus|spoof_uname|open_redirect' \
            $SEARCH_ROOTS | tee ../artifacts/reports/full-susfs-addon-inventory.log || true
          rg -n --hidden --glob '!**/.git/**' \
            '(KernelSU|KSU|ksu_).*(SuSFS|SUSFS|susfs|KPM|KPatch|APatch|Magic Mount)|(SuSFS|SUSFS|susfs|KPM|KPatch|APatch|Magic Mount).*(KernelSU|KSU|ksu_)' \
            $SEARCH_ROOTS | tee ../artifacts/reports/ksu-susfs-intersection.log || true
          find $SEARCH_ROOTS -type f \( -ipath '*kernelsu*' -o -iname '*ksu*' -o -iname '*rksu*' -o -iname '*sukisu*' \) -not -path '*/.git/*' \
            | sort | tee ../artifacts/reports/ksu-named-files.txt || true
          find $SEARCH_ROOTS -type f \( -iname '*susfs*' -o -ipath '*susfs*' -o -iname '*kpm*' -o -iname '*apatch*' -o -iname '*kpatch*' \) -not -path '*/.git/*' \
            | sort | tee ../artifacts/reports/susfs-addon-named-files.txt || true
          rg -n --hidden --glob '!**/.git/**' \
            'CONFIG_KSU|config KSU|menuconfig KSU|source ".*KernelSU|drivers/kernelsu|obj-\$\(CONFIG_KSU\)|KernelSU/kernel|KSU_LSM|KSU_MANUAL|KSU_KPROBES' \
            $SEARCH_ROOTS | tee ../artifacts/reports/ksu-kconfig-makefile-config-clues.log || true
          rg -n --hidden --glob '!**/.git/**' \
            'CONFIG_KSU_SUSFS|config KSU_SUSFS|SUSFS|susfs|sus_path|sus_mount|sus_su|KSU_SUSFS_' \
            $SEARCH_ROOTS | tee ../artifacts/reports/susfs-kconfig-makefile-config-clues.log || true

      - name: Diff selected DXRN kernel branches against clean base
        shell: bash
        env:
          DXRN_ORG: ${{ github.event.inputs.dxrn_org }}
        run: |
          set -euo pipefail
          cd workspace/base-kernel
          while IFS=$'\t' read -r repo branch dest; do
            echo "$repo" | grep -Eiq 'kernel_xiaomi_ruby|kernel_xiaomi_mt6877' || continue
            remote_name="${repo}_$(echo "$branch" | tr '/:@ ' '____')"
            url="https://github.com/${DXRN_ORG}/${repo}.git"
            git remote remove "$remote_name" 2>/dev/null || true
            git remote add "$remote_name" "$url"
            git fetch --depth 300 "$remote_name" "$branch" || git fetch "$remote_name" "$branch" || true
            REF=FETCH_HEAD
            git diff --stat HEAD..$REF | tee "../../artifacts/patches/${remote_name}-diffstat.log" || true
            git diff --name-status HEAD..$REF | tee "../../artifacts/patches/${remote_name}-changed-files.log" || true
            git diff --unified=60 HEAD..$REF -- Kconfig Makefile drivers fs include init ipc kernel lib mm security arch/arm64/configs 2>/dev/null \
              | tee "../../artifacts/patches/${remote_name}-full-kernel-diff.diff" >/dev/null || true
            grep -E -i -C 80 'KernelSU|KSU|ksu_|ksud|CONFIG_KSU|drivers/kernelsu|KernelSU/kernel|security_hook|execve|faccessat|statx|input_handle_event|vfs_read|devpts|sys_reboot' \
              "../../artifacts/patches/${remote_name}-full-kernel-diff.diff" \
              | tee "../../artifacts/patches/${remote_name}-ksu-context.diff" || true
            grep -E -i -C 80 'SuSFS|SUSFS|susfs|CONFIG_KSU_SUSFS|KPM|KPatch|APatch|sus_path|sus_mount|sus_su|hide_sus|spoof_uname|open_redirect' \
              "../../artifacts/patches/${remote_name}-full-kernel-diff.diff" \
              | tee "../../artifacts/patches/${remote_name}-susfs-addon-context.diff" || true
          done < ../../artifacts/reports/selected-branches.tsv

      - name: Generate study summary
        shell: bash
        env:
          BASE_REPO: ${{ github.event.inputs.base_repo }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch }}
        run: |
          set -euo pipefail
          KSU_FILES="$(wc -l < artifacts/reports/ksu-named-files.txt 2>/dev/null || echo 0)"
          SUS_FILES="$(wc -l < artifacts/reports/susfs-addon-named-files.txt 2>/dev/null || echo 0)"
          INTERSECTIONS="$(wc -l < artifacts/reports/ksu-susfs-intersection.log 2>/dev/null || echo 0)"
          cat > artifacts/reports/KSU_MINUS_SUSFS_STUDY.md <<EOF
          # DXRN full KSU study with SuSFS isolated

          This artifact studies all public DXRN-MoonWake repositories and selected relevant branches.
          It does **not** patch or build the kernel.

          ## Base
          - Base repo: ${BASE_REPO}
          - Base branch: ${BASE_BRANCH}

          ## Counts
          - KSU/root named files: ${KSU_FILES}
          - SuSFS/addon named files: ${SUS_FILES}
          - Mixed KSU + SuSFS/addon lines: ${INTERSECTIONS}

          ## Read first
          1. reports/org-repos.tsv
          2. reports/selected-branches.tsv
          3. reports/full-ksu-root-inventory.log
          4. reports/full-susfs-addon-inventory.log
          5. reports/ksu-susfs-intersection.log
          6. reports/ksu-kconfig-makefile-config-clues.log
          7. reports/susfs-kconfig-makefile-config-clues.log
          8. patches/*-ksu-context.diff
          9. patches/*-susfs-addon-context.diff

          ## Rule for the next build
          Keep DXRN's KSU integration path intact. Remove/avoid only SuSFS/addon pieces:
          susfs, CONFIG_KSU_SUSFS, KSU_SUSFS_*, sus_path, sus_mount, sus_su, KPM, KPatch, APatch.
          EOF
          sed -i 's/^[[:space:]]*//' artifacts/reports/KSU_MINUS_SUSFS_STUDY.md

      - name: Package audit artifact
        shell: bash
        env:
          OUTPUT_SUFFIX: ${{ github.event.inputs.output_suffix }}
        run: |
          set -euo pipefail
          cd artifacts
          find . -maxdepth 4 -type f | sort | tee logs/final-artifacts-tree.log
          zip -r9 "DXRN-${OUTPUT_SUFFIX}-$(date -u +%Y%m%d-%H%M%S).zip" logs reports raw branches patches

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DXRN-${{ github.event.inputs.output_suffix }}
          path: artifacts/
          retention-days: 30
