name: Audit Build Rubyx + Aeron KSU SuSFS

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel base donde se aplicara KSU/SuSFS"
        required: true
        default: "RubyxLabs/kernel_xiaomi_mt6877"
        type: string
      kernel_branch:
        description: "Branch del kernel base"
        required: true
        default: "lineage-23.2"
        type: string
      defconfig:
        description: "Defconfig principal"
        required: true
        default: "ruby_defconfig"
        type: string
      aeron_repo:
        description: "Repo Aeron que SI tiene KSU/SuSFS"
        required: true
        default: "DXRN-MoonWake/aeron_kernel_xiaomi_ruby"
        type: string
      aeron_ksu_branch:
        description: "Branch Aeron con KSU/SuSFS"
        required: true
        default: "ksu_susfs"
        type: string
      aeron_base_branch:
        description: "Branch Aeron base sin/antes de KSU para calcular delta limpio"
        required: true
        default: "lineage-23.0"
        type: string
      aeron_zip_url:
        description: "ZIP oficial Aeron usado como base AnyKernel3"
        required: true
        default: "https://github.com/DXRN-MoonWake/aeron_kernel_xiaomi_ruby/releases/download/1.0.2/Aeron-Phoenix-1.0.2-83-9afe3d8-release.zip"
        type: string
      aeron_zip_sha256:
        description: "SHA256 esperado del ZIP Aeron"
        required: true
        default: "e34b549d6b7d0c07e7f2f060aba3ec204e01844391031e15fff934607f315c24"
        type: string
      output_suffix:
        description: "Sufijo del ZIP final"
        required: true
        default: "AERON-KSU-SUSFS-AUDIT"
        type: string
      strict_ksu:
        description: "Fallar si CONFIG_KSU no queda y"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEVICE_CODENAME: ruby
  CLANG_VERSION: clang-r563880
  CLANG_COMMIT: 6f88d37dd82ba741ca279539d44bb7da27ab1844
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit-build:
    name: Audit + Build Aeron KSU/SuSFS on Rubyx base
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Prepare audit workspace and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace artifacts/{logs,patches,zips,source,manifests,runtime,diagnostics} toolchains
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git libssl-dev libelf-dev libfl-dev libncurses6 \
            python3 python-is-python3 python3-dev python3-setuptools wget curl patch zip unzip rsync jq file ripgrep \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi lz4 zstd xz-utils ca-certificates ccache
          SWAPFILE=/mnt/kernel-build-swapfile
          if ! swapon --show | grep -q "$SWAPFILE"; then
            sudo rm -f "$SWAPFILE" || true
            sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192
            sudo chmod 600 "$SWAPFILE"
            sudo mkswap "$SWAPFILE"
            sudo swapon "$SWAPFILE"
          fi
          {
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=${RUNNER_OS:-unknown}"
            echo "arch=$ARCH subarch=$SUBARCH device=$DEVICE_CODENAME"
            echo "clang=$CLANG_VERSION commit=$CLANG_COMMIT"
            df -h
            free -h
          } | tee artifacts/logs/00-runner-environment.log

      - name: Restore clang cache
        uses: actions/cache@v4
        with:
          path: toolchains/${{ env.CLANG_VERSION }}
          key: aosp-${{ env.CLANG_VERSION }}-${{ env.CLANG_COMMIT }}-linux-x86

      - name: Download AOSP clang
        shell: bash
        run: |
          set -euo pipefail
          CLANG_DIR="$GITHUB_WORKSPACE/toolchains/$CLANG_VERSION"
          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            rm -rf "$CLANG_DIR"
            mkdir -p "$CLANG_DIR"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/${CLANG_VERSION}.tar.gz"
            curl -L --fail --retry 5 --retry-delay 5 "$CLANG_URL" -o "workspace/${CLANG_VERSION}.tar.gz"
            tar -xzf "workspace/${CLANG_VERSION}.tar.gz" -C "$CLANG_DIR"
          fi
          "$CLANG_DIR/bin/clang" --version | tee artifacts/logs/01-clang-version.log

      - name: Clone base kernel and Aeron references
        shell: bash
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          AERON_REPO: ${{ inputs.aeron_repo }}
          AERON_KSU_BRANCH: ${{ inputs.aeron_ksu_branch }}
          AERON_BASE_BRANCH: ${{ inputs.aeron_base_branch }}
        run: |
          set -euo pipefail
          cd workspace
          git clone --depth 1 --branch "$KERNEL_BRANCH" "https://github.com/${KERNEL_REPO}.git" kernel-src
          git clone --filter=blob:none "https://github.com/${AERON_REPO}.git" aeron-ref

          cd kernel-src
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          {
            echo "BASE_REPO=$KERNEL_REPO"
            echo "BASE_BRANCH=$KERNEL_BRANCH"
            git remote -v
            git show -s --format='base_commit=%H%nbase_date=%cI%nbase_subject=%s' HEAD
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile
          } | tee ../../artifacts/logs/02-base-kernel-info.log
          find arch/arm64/configs -maxdepth 3 -type f -iname '*defconfig' | sort | tee ../../artifacts/logs/03-base-defconfigs.log

          cd ../aeron-ref
          git fetch --depth 500 origin "$AERON_KSU_BRANCH" "$AERON_BASE_BRANCH"
          git checkout -f "origin/${AERON_KSU_BRANCH}"
          {
            echo "AERON_REPO=$AERON_REPO"
            echo "AERON_KSU_BRANCH=$AERON_KSU_BRANCH"
            echo "AERON_BASE_BRANCH=$AERON_BASE_BRANCH"
            git show -s --format='aeron_ksu_commit=%H%naeron_ksu_date=%cI%naeron_ksu_subject=%s' HEAD
            git show -s --format='aeron_base_commit=%H%naeron_base_date=%cI%naeron_base_subject=%s' "origin/${AERON_BASE_BRANCH}" || true
          } | tee ../../artifacts/logs/04-aeron-branch-info.log
          git branch -r | sort | tee ../../artifacts/logs/05-aeron-remote-branches.log
          git log --oneline --decorate --max-count=200 --grep='KSU\|KernelSU\|SuSFS\|susfs\|ksu\|umount\|selinux\|hook' --all \
            | tee ../../artifacts/logs/06-aeron-related-commits.log || true

      - name: Audit Aeron KSU/SuSFS source before integration
        shell: bash
        env:
          AERON_KSU_BRANCH: ${{ inputs.aeron_ksu_branch }}
          AERON_BASE_BRANCH: ${{ inputs.aeron_base_branch }}
        run: |
          set -euo pipefail
          cd workspace/aeron-ref
          echo "== Aeron KSU/SuSFS inventory ==" | tee ../../artifacts/logs/07-aeron-ksu-susfs-inventory.log
          for p in drivers/kernelsu KernelSU kernel fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h include/uapi/linux/susfs.h; do
            if [ -e "$p" ]; then
              echo "FOUND $p" | tee -a ../../artifacts/logs/07-aeron-ksu-susfs-inventory.log
              find "$p" -maxdepth 3 -type f 2>/dev/null | sort | tee -a ../../artifacts/logs/07-aeron-ksu-susfs-inventory.log || true
            else
              echo "MISSING $p" | tee -a ../../artifacts/logs/07-aeron-ksu-susfs-inventory.log
            fi
          done

          rg -n "(^|[[:space:]])(menuconfig|config)[[:space:]]+(KSU|KSU_SUSFS|KPM)|KernelSU|susfs|ksu" \
            Kconfig drivers fs kernel include security mm block 2>/dev/null \
            | tee ../../artifacts/logs/08-aeron-grep-ksu-susfs.log || true

          git diff --stat "origin/${AERON_BASE_BRANCH}" "origin/${AERON_KSU_BRANCH}" \
            | tee ../../artifacts/logs/09-aeron-delta-stat.log || true
          git diff --name-status "origin/${AERON_BASE_BRANCH}" "origin/${AERON_KSU_BRANCH}" \
            | tee ../../artifacts/logs/10-aeron-delta-files.log || true

      - name: Generate and apply Aeron KSU/SuSFS delta to base
        shell: bash
        env:
          AERON_KSU_BRANCH: ${{ inputs.aeron_ksu_branch }}
          AERON_BASE_BRANCH: ${{ inputs.aeron_base_branch }}
        run: |
          set -euo pipefail
          cd workspace/aeron-ref

          # Full Aeron KSU/SuSFS delta. This intentionally captures more than just drivers/kernelsu,
          # because Aeron KSU/SuSFS touches fs, kernel, security, mm, block, include, configs and Makefiles.
          git diff --binary --find-renames "origin/${AERON_BASE_BRANCH}" "origin/${AERON_KSU_BRANCH}" > ../../artifacts/patches/aeron-full-ksu-susfs.patch

          cd ../kernel-src
          echo "Applying Aeron full delta ${AERON_BASE_BRANCH}..${AERON_KSU_BRANCH}" | tee ../../artifacts/logs/11-apply-aeron-delta.log
          set +e
          git apply --check ../../artifacts/patches/aeron-full-ksu-susfs.patch >> ../../artifacts/logs/11-apply-aeron-delta.log 2>&1
          check_rc=$?
          set -e
          if [ "$check_rc" = "0" ]; then
            git apply --index ../../artifacts/patches/aeron-full-ksu-susfs.patch 2>&1 | tee -a ../../artifacts/logs/11-apply-aeron-delta.log
            git commit -m "Apply Aeron KSU/SuSFS full delta" || true
          else
            echo "Clean git apply failed; trying 3-way apply with rejects" | tee -a ../../artifacts/logs/11-apply-aeron-delta.log
            set +e
            git apply --3way --reject ../../artifacts/patches/aeron-full-ksu-susfs.patch >> ../../artifacts/logs/11-apply-aeron-delta.log 2>&1
            apply_rc=$?
            set -e
            find . -name '*.rej' -print | tee ../../artifacts/logs/12-aeron-rejects.log || true
            if [ "$apply_rc" != "0" ] || [ -s ../../artifacts/logs/12-aeron-rejects.log ]; then
              echo "ERROR: Aeron patch rejected. Check artifacts/logs/11-apply-aeron-delta.log and 12-aeron-rejects.log" | tee ../../artifacts/logs/13-aeron-patch-error.log
              exit 1
            fi
            git add -A
            git commit -m "Apply Aeron KSU/SuSFS full delta with 3-way" || true
          fi

          echo "== Post-patch source status ==" | tee ../../artifacts/logs/14-postpatch-git-status.log
          git status --short | tee -a ../../artifacts/logs/14-postpatch-git-status.log || true
          rg -n "(^|[[:space:]])(menuconfig|config)[[:space:]]+(KSU|KSU_SUSFS|KPM)|KernelSU|susfs|ksu" \
            Kconfig drivers fs kernel include security mm block arch/arm64/configs 2>/dev/null \
            | tee ../../artifacts/logs/15-postpatch-ksu-susfs-grep.log || true

          if ! rg -q "(^|[[:space:]])(menuconfig|config)[[:space:]]+KSU\b" Kconfig drivers fs kernel security arch/arm64 2>/dev/null; then
            echo "ERROR: Kconfig symbol KSU still missing after Aeron patch. KernelSU cannot be enabled." | tee ../../artifacts/logs/16-missing-ksu-kconfig.log
            exit 1
          fi

      - name: Configure kernel and force KSU/SuSFS builtin
        shell: bash
        env:
          DEFCONFIG_INPUT: ${{ inputs.defconfig }}
          STRICT_KSU: ${{ inputs.strict_ksu }}
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchains/$CLANG_VERSION/bin:$PATH"
          cd workspace/kernel-src

          make_common_array() {
            MAKE_COMMON=(
              O="$OUT_DIR"
              ARCH=arm64
              SUBARCH=arm64
              CC="ccache clang"
              LD=ld.lld
              AR=llvm-ar
              NM=llvm-nm
              OBJCOPY=llvm-objcopy
              OBJDUMP=llvm-objdump
              STRIP=llvm-strip
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              CLANG_TRIPLE=aarch64-linux-gnu-
              LLVM=1
              LLVM_IAS=1
            )
          }

          select_defconfig() {
            local def="$DEFCONFIG_INPUT"
            if [ ! -f "arch/arm64/configs/$def" ]; then
              def="$(find arch/arm64/configs -maxdepth 3 -type f \( -name '*ruby*defconfig' -o -name '*mt6877*defconfig' -o -name '*k6877*defconfig' \) | sed 's#arch/arm64/configs/##' | sort | head -n1)"
            fi
            test -n "$def" && test -f "arch/arm64/configs/$def"
            echo "$def"
          }

          make_common_array
          DEFCONFIG="$(select_defconfig)"
          echo "$DEFCONFIG" | tee ../../artifacts/logs/17-selected-defconfig.log
          make "${MAKE_COMMON[@]}" "$DEFCONFIG" 2>&1 | tee ../../artifacts/logs/18-defconfig.log

          mkdir -p arch/arm64/configs/vendor
          cat > arch/arm64/configs/vendor/droidspaces-runtime.config <<'EOF'
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_NSFS=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_NET_NS=y
          CONFIG_USER_NS=n
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_PERF=y
          CONFIG_CGROUP_BPF=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_EXT4_FS_SECURITY=y
          CONFIG_FUSE_FS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_TUN=y
          CONFIG_DUMMY=y
          CONFIG_MACVLAN=y
          CONFIG_IPVLAN=y
          CONFIG_VXLAN=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF
          sed -i 's/^          //' arch/arm64/configs/vendor/droidspaces-runtime.config

          # Merge runtime config, but NEVER merge a no-root config in this workflow.
          scripts/kconfig/merge_config.sh -m -O "$OUT_DIR" "$OUT_DIR/.config" arch/arm64/configs/vendor/droidspaces-runtime.config \
            2>&1 | tee ../../artifacts/logs/19-merge-droidspaces-runtime.log

          # Keep UTS_RELEASE short to avoid >64 chars errors.
          scripts/config --file "$OUT_DIR/.config" --set-str LOCALVERSION "-DS-AKSU"
          scripts/config --file "$OUT_DIR/.config" --disable LOCALVERSION_AUTO || true

          # Force KSU/SuSFS builtin. If a symbol is unknown, scripts/config may not preserve it after olddefconfig;
          # the post-check below is authoritative.
          for sym in \
            KSU \
            KSU_KPROBES_HOOK \
            KSU_KPROBE_HOOKS \
            KSU_MANUAL_HOOK \
            KSU_SUSFS \
            KSU_SUSFS_SUS_PATH \
            KSU_SUSFS_SUS_MOUNT \
            KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            KSU_SUSFS_SUS_KSTAT \
            KSU_SUSFS_TRY_UMOUNT \
            KSU_SUSFS_SPOOF_UNAME \
            KSU_SUSFS_ENABLE_LOG \
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            KSU_SUSFS_OPEN_REDIRECT \
            KSU_SUSFS_SUS_SU \
            KALLSYMS \
            KALLSYMS_ALL \
            IKCONFIG \
            IKCONFIG_PROC; do
            echo "forcing CONFIG_${sym}=y" | tee -a ../../artifacts/logs/20-force-ksu-symbols.log
            scripts/config --file "$OUT_DIR/.config" --enable "$sym" || true
          done

          make "${MAKE_COMMON[@]}" olddefconfig 2>&1 | tee ../../artifacts/logs/21-olddefconfig.log
          cp "$OUT_DIR/.config" ../../artifacts/logs/22-final-kernel.config

          {
            echo "==== FINAL KSU CONFIG ===="
            grep -E '^CONFIG_KSU|^CONFIG_KPM|^CONFIG_SUSFS|^CONFIG_KALLSYMS|^CONFIG_IKCONFIG|^CONFIG_OVERLAY_FS|^CONFIG_PID_NS|^CONFIG_NET_NS|^CONFIG_CGROUPS' "$OUT_DIR/.config" || true
          } | tee ../../artifacts/logs/23-final-ksu-config.log

          if [ "$STRICT_KSU" = "true" ]; then
            grep -q '^CONFIG_KSU=y' "$OUT_DIR/.config" || { echo "ERROR: CONFIG_KSU is not y after olddefconfig" | tee ../../artifacts/logs/24-ksu-not-enabled-error.log; exit 1; }
          fi

          # Sanity check UTS release before expensive build.
          make "${MAKE_COMMON[@]}" include/generated/utsrelease.h 2>&1 | tee ../../artifacts/logs/25-utsrelease.log
          UTS="$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' "$OUT_DIR/include/generated/utsrelease.h" | head -n1)"
          echo "UTS_RELEASE=${UTS}" | tee ../../artifacts/logs/26-utsrelease-value.log
          if [ "${#UTS}" -gt 64 ]; then
            echo "ERROR: UTS_RELEASE too long: ${#UTS}" | tee ../../artifacts/logs/27-utsrelease-too-long.log
            exit 1
          fi

      - name: Build kernel with complete logs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchains/$CLANG_VERSION/bin:$PATH"
          cd workspace/kernel-src
          MAKE_COMMON=(
            O="$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang"
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
          )

          set +e
          make -j"$(nproc --all)" "${MAKE_COMMON[@]}" 2>&1 | tee ../../artifacts/logs/28-build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            echo "ERROR: kernel build failed rc=${rc}" | tee ../../artifacts/logs/29-build-error.log
            grep -nEi 'error:|fatal:|undefined reference|No rule to make target|implicit declaration|redefinition|conflicting types|No such file|Stop\.' ../../artifacts/logs/28-build.log \
              | tee ../../artifacts/logs/30-build-error-extract.log || true
            exit "$rc"
          fi

          find "$OUT_DIR/arch/arm64/boot" -maxdepth 5 -type f \
            \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' -o -name 'dtbo.img' \) \
            -printf '%p %s bytes\n' | sort | tee ../../artifacts/logs/31-build-outputs.log
          test -f "$OUT_DIR/arch/arm64/boot/Image.gz" || test -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb"

      - name: Audit built kernel image for KSU/SuSFS strings and symbols
        shell: bash
        run: |
          set -euo pipefail
          cd workspace/kernel-src
          BOOTDIR="$OUT_DIR/arch/arm64/boot"
          IMAGE=""
          [ -f "$BOOTDIR/Image" ] && IMAGE="$BOOTDIR/Image"
          [ -n "$IMAGE" ] || { echo "WARN: raw Image missing; strings audit limited" | tee ../../artifacts/logs/32-image-audit-warning.log; exit 0; }

          {
            echo "==== strings grep ksu/susfs ===="
            strings "$IMAGE" | grep -Ei 'KernelSU|kernelsu|KSU|susfs|SUSFS|ksud|ksu' | head -n 300 || true
            echo "==== kallsyms-like System.map grep ===="
            if [ -f "$OUT_DIR/System.map" ]; then grep -Ei 'ksu|susfs|kernelsu' "$OUT_DIR/System.map" | head -n 300 || true; fi
          } | tee ../../artifacts/logs/33-built-image-ksu-susfs-audit.log

          if ! strings "$IMAGE" | grep -Eiq 'KernelSU|kernelsu|susfs|SUSFS|ksud|ksu'; then
            echo "ERROR: Built Image does not contain visible KSU/SuSFS strings. Manager will probably not detect KSU." \
              | tee ../../artifacts/logs/34-built-image-missing-ksu-error.log
            exit 1
          fi

      - name: Download and inspect Aeron AnyKernel3 base ZIP
        shell: bash
        env:
          AERON_ZIP_URL: ${{ inputs.aeron_zip_url }}
          AERON_ZIP_SHA256: ${{ inputs.aeron_zip_sha256 }}
        run: |
          set -euo pipefail
          cd workspace
          echo "Forced Aeron ZIP URL: ${AERON_ZIP_URL}" | tee ../artifacts/logs/35-aeron-zip-url.log
          curl -L --fail --connect-timeout 30 --retry 10 --retry-delay 10 --retry-all-errors \
            -H "User-Agent: Mozilla/5.0 GitHubActions AeronKSUAudit" \
            -H "Accept: application/octet-stream" \
            "$AERON_ZIP_URL" -o aeron-anykernel-base.zip
          echo "${AERON_ZIP_SHA256}  aeron-anykernel-base.zip" | sha256sum -c - | tee ../artifacts/logs/36-aeron-zip-sha256-check.log
          unzip -l aeron-anykernel-base.zip | tee ../artifacts/logs/37-aeron-anykernel-list.log
          rm -rf anykernel
          mkdir -p anykernel
          unzip -q aeron-anykernel-base.zip -d anykernel
          find anykernel -maxdepth 4 -type f | sort | tee ../artifacts/logs/38-aeron-anykernel-tree.log

      - name: Create runtime audit helper scripts
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/runtime/ksu-runtime-audit-adb.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          OUT="ksu-runtime-audit-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$OUT"
          adb wait-for-device
          adb shell uname -a | tee "$OUT/uname.txt" || true
          adb shell 'zcat /proc/config.gz 2>/dev/null | grep -E "CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_IKCONFIG|CONFIG_OVERLAY_FS"' | tee "$OUT/proc-config-ksu.txt" || true
          adb shell 'cat /proc/version' | tee "$OUT/proc-version.txt" || true
          adb shell 'dmesg | grep -Ei "ksu|kernelsu|susfs|ksud|selinux|avc|audit"' | tee "$OUT/dmesg-ksu-susfs.txt" || true
          adb shell 'ls -la /dev/kernelsu /sys/kernel 2>/dev/null' | tee "$OUT/kernel-nodes.txt" || true
          adb shell 'ps -A | grep -Ei "ksu|ksud|su"' | tee "$OUT/processes-ksu.txt" || true
          adb shell 'logcat -d | grep -Ei "KernelSU|kernelsu|ksu|ksud|susfs|avc|denied"' | tee "$OUT/logcat-ksu.txt" || true
          tar -czf "$OUT.tar.gz" "$OUT"
          echo "Saved $OUT.tar.gz"
          EOF
          sed -i 's/^          //' artifacts/runtime/ksu-runtime-audit-adb.sh
          chmod +x artifacts/runtime/ksu-runtime-audit-adb.sh

      - name: Package AnyKernel3 ZIP with audited kernel
        shell: bash
        env:
          OUTPUT_SUFFIX: ${{ inputs.output_suffix }}
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          AERON_REPO: ${{ inputs.aeron_repo }}
          AERON_KSU_BRANCH: ${{ inputs.aeron_ksu_branch }}
          AERON_BASE_BRANCH: ${{ inputs.aeron_base_branch }}
        run: |
          set -euo pipefail
          cd workspace
          AK=anykernel
          KERNEL_BOOT="kernel-src/$OUT_DIR/arch/arm64/boot"

          rm -f "$AK"/Image "$AK"/Image.gz "$AK"/Image.gz-dtb "$AK"/*.dtb "$AK"/*.dtbo "$AK"/dtbo.img || true
          [ ! -f "$KERNEL_BOOT/Image.gz-dtb" ] || cp "$KERNEL_BOOT/Image.gz-dtb" "$AK/Image.gz-dtb"
          [ ! -f "$KERNEL_BOOT/Image.gz" ] || cp "$KERNEL_BOOT/Image.gz" "$AK/Image.gz"
          [ ! -f "$KERNEL_BOOT/Image" ] || cp "$KERNEL_BOOT/Image" "$AK/Image"
          [ ! -f "$KERNEL_BOOT/dtbo.img" ] || cp "$KERNEL_BOOT/dtbo.img" "$AK/dtbo.img"
          find "$KERNEL_BOOT/dts" -type f \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp -f {} "$AK/" \; 2>/dev/null || true

          cat > "$AK/build-manifest-aeron-ksu-susfs-audit.txt" <<EOF
          Build UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Base kernel: $KERNEL_REPO / $KERNEL_BRANCH
          Aeron source: $AERON_REPO / $AERON_BASE_BRANCH..$AERON_KSU_BRANCH
          Device: ruby / mt6877
          Build mode: KSU/SuSFS enforced and audited
          Important: install a manager compatible with the KernelSU/RKSU implementation actually reported by runtime audit.
          EOF
          sed -i 's/^          //' "$AK/build-manifest-aeron-ksu-susfs-audit.txt"

          cp ../artifacts/logs/23-final-ksu-config.log "$AK/final-ksu-config.txt" || true
          cp ../artifacts/runtime/ksu-runtime-audit-adb.sh "$AK/ksu-runtime-audit-adb.sh" || true

          find "$AK" -maxdepth 3 -type f | sort | tee ../artifacts/logs/39-anykernel-final-tree.log
          OUTZIP="../artifacts/zips/Rubyx-ruby-${OUTPUT_SUFFIX}-$(date -u +%Y%m%d-%H%M).zip"
          (cd "$AK" && zip -r9 "$OUTZIP" . -x '*.git*' 2>&1 | tee ../../artifacts/logs/40-zip.log)
          sha256sum "$OUTZIP" | tee ../artifacts/logs/41-final-zip-sha256.log
          ls -lh ../artifacts/zips | tee ../artifacts/logs/42-zips.log
          test "$(stat -c%s "$OUTZIP")" -gt 10000000

      - name: Generate audit summary
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "# Aeron KSU/SuSFS Audit Summary"
            echo
            echo "## Base"
            cat artifacts/logs/02-base-kernel-info.log 2>/dev/null
            echo
            echo "## Aeron"
            cat artifacts/logs/04-aeron-branch-info.log 2>/dev/null
            echo
            echo "## Final KSU config"
            cat artifacts/logs/23-final-ksu-config.log 2>/dev/null
            echo
            echo "## Built image KSU/SuSFS audit"
            cat artifacts/logs/33-built-image-ksu-susfs-audit.log 2>/dev/null | head -n 120
            echo
            echo "## Errors extracted"
            cat artifacts/logs/30-build-error-extract.log 2>/dev/null
            cat artifacts/logs/12-aeron-rejects.log 2>/dev/null
            cat artifacts/logs/16-missing-ksu-kconfig.log 2>/dev/null
            cat artifacts/logs/24-ksu-not-enabled-error.log 2>/dev/null
            cat artifacts/logs/34-built-image-missing-ksu-error.log 2>/dev/null
          } | tee artifacts/diagnostics/AUDIT-SUMMARY.md

      - name: Upload all audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-aeron-ksu-susfs-audit-artifacts
          path: |
            artifacts/logs/**
            artifacts/patches/**
            artifacts/source/**
            artifacts/diagnostics/**
            artifacts/runtime/**
            artifacts/zips/**
          if-no-files-found: warn
