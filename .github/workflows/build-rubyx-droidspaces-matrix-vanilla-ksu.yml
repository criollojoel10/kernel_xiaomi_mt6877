name: Build Rubyx AOSP DroidSpaces KSU Strict Fallback V2

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repositorio kernel original RubyxLabs"
        required: true
        default: "RubyxLabs/kernel_xiaomi_mt6877"
        type: string
      kernel_branch:
        description: "Branch base actualizado"
        required: true
        default: "lineage-23.2"
        type: string
      defconfig:
        description: "Defconfig; autodetecta ruby/mt6877 si no existe"
        required: true
        default: "ruby_defconfig"
        type: string
      aeron_repo:
        description: "Repo usado solo como base AnyKernel3"
        required: true
        default: "DXRN-MoonWake/aeron_kernel_xiaomi_ruby"
        type: string
      aeron_tag:
        description: "Release tag usado como base AnyKernel3"
        required: true
        default: "1.0.2"
        type: string

permissions:
  contents: read
  actions: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEVICE_CODENAME: ruby
  CLANG_VERSION: clang-r563880
  CLANG_COMMIT: 6f88d37dd82ba741ca279539d44bb7da27ab1844
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: vanilla-droidspaces
            root_mode: none
            variant_suffix: Vanilla-DroidSpaces-AOSP
          - variant: ksu-droidspaces
            root_mode: ksu
            variant_suffix: KSU-DroidSpaces-AOSP

    steps:
      - name: Prepare dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace artifacts/logs artifacts/zips artifacts/source artifacts/manifests toolchains
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git libssl-dev libelf-dev libfl-dev libncurses6 \
            python3 python-is-python3 python3-dev python3-setuptools wget curl patch zip unzip rsync jq file \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi lz4 zstd xz-utils ca-certificates ccache
          SWAPFILE=/mnt/kernel-build-swapfile
          if ! swapon --show | grep -q "$SWAPFILE"; then
            sudo rm -f "$SWAPFILE" || true
            sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192
            sudo chmod 600 "$SWAPFILE"
            sudo mkswap "$SWAPFILE"
            sudo swapon "$SWAPFILE"
          fi
          df -h | tee artifacts/logs/disk-before-${{ matrix.variant }}.log || true
          free -h | tee artifacts/logs/memory-before-${{ matrix.variant }}.log || true

      - name: Restore clang cache
        uses: actions/cache@v4
        with:
          path: toolchains/${{ env.CLANG_VERSION }}
          key: aosp-${{ env.CLANG_VERSION }}-${{ env.CLANG_COMMIT }}-linux-x86

      - name: Download AOSP clang if needed
        shell: bash
        run: |
          set -euo pipefail
          CLANG_DIR="$GITHUB_WORKSPACE/toolchains/$CLANG_VERSION"
          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            rm -rf "$CLANG_DIR"
            mkdir -p "$CLANG_DIR"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/${CLANG_VERSION}.tar.gz"
            curl -L --fail --retry 5 --retry-delay 5 "$CLANG_URL" -o "workspace/${CLANG_VERSION}.tar.gz"
            tar -xzf "workspace/${CLANG_VERSION}.tar.gz" -C "$CLANG_DIR"
          fi
          "$CLANG_DIR/bin/clang" --version | tee artifacts/logs/clang-version-${{ matrix.variant }}.log

      - name: Clone stock kernel
        shell: bash
        env:
          KERNEL_REPO: ${{ github.event.inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/workspace"
          git clone --depth 1 --branch "$KERNEL_BRANCH" "https://github.com/${KERNEL_REPO}.git" kernel-clean
          cd kernel-clean
          git remote -v | tee "$GITHUB_WORKSPACE/artifacts/logs/kernel-source-remote-${{ matrix.variant }}.log"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/artifacts/logs/kernel-source-commit-${{ matrix.variant }}.log"
          git show -s --format='%H%n%cI%n%s' HEAD | tee "$GITHUB_WORKSPACE/artifacts/logs/kernel-source-latest-${{ matrix.variant }}.log"
          git log --oneline -30 | tee "$GITHUB_WORKSPACE/artifacts/logs/kernel-source-history-${{ matrix.variant }}.log"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile | tee "$GITHUB_WORKSPACE/artifacts/logs/kernel-version-${{ matrix.variant }}.log"
          find arch/arm64/configs -maxdepth 3 -type f -iname '*defconfig' | sort | tee "$GITHUB_WORKSPACE/artifacts/logs/available-defconfigs-${{ matrix.variant }}.log"

      - name: Download Aeron AnyKernel3 base
        shell: bash
        env:
          AERON_REPO: ${{ github.event.inputs.aeron_repo }}
          AERON_TAG: ${{ github.event.inputs.aeron_tag }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/workspace"
          curl -L --fail -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${AERON_REPO}/releases/tags/${AERON_TAG}" -o aeron-release.json
          cp aeron-release.json "$GITHUB_WORKSPACE/artifacts/logs/aeron-release-${AERON_TAG}-${{ matrix.variant }}.json"
          jq -r '.assets[] | "asset: \(.name) url=\(.browser_download_url)"' aeron-release.json | tee "$GITHUB_WORKSPACE/artifacts/logs/aeron-release-assets-${{ matrix.variant }}.log"
          ZIP_URL="$(jq -r '.assets[] | select(.name | test("\\.zip$"; "i")) | .browser_download_url' aeron-release.json | head -n1)"
          test -n "$ZIP_URL" && test "$ZIP_URL" != null
          curl -L --fail --retry 5 --retry-delay 5 "$ZIP_URL" -o aeron-anykernel-base.zip
          sha256sum aeron-anykernel-base.zip | tee "$GITHUB_WORKSPACE/artifacts/logs/aeron-anykernel-base-${{ matrix.variant }}.zip.sha256"

      - name: Build variant with strict fallback
        shell: bash
        env:
          DEFCONFIG_INPUT: ${{ github.event.inputs.defconfig }}
          MATRIX_VARIANT: ${{ matrix.variant }}
          ROOT_MODE: ${{ matrix.root_mode }}
          VARIANT_SUFFIX: ${{ matrix.variant_suffix }}
          KERNEL_REPO_INPUT: ${{ github.event.inputs.kernel_repo }}
          KERNEL_BRANCH_INPUT: ${{ github.event.inputs.kernel_branch }}
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchains/$CLANG_VERSION/bin:$PATH"
          export WORKSPACE_DIR="$GITHUB_WORKSPACE/workspace"
          export ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          export KERNEL_CLEAN="$WORKSPACE_DIR/kernel-clean"
          mkdir -p "$ARTIFACTS_DIR/logs" "$ARTIFACTS_DIR/zips" "$ARTIFACTS_DIR/source" "$ARTIFACTS_DIR/manifests"

          cat > "$ARTIFACTS_DIR/manifests/ksu-fallback-order.tsv" <<'EOF'
          mode	repo	branch	label	reason
          aeron-patch	DXRN-MoonWake/aeron_kernel_xiaomi_ruby	ksu_susfs	aeron-kernelsu-main-susfs	Same Rubyx base with KernelSU main and SuSFS already integrated
          setup	DXRN-MoonWake/RKSU	new_upstream	rksu-new_upstream	RKSU fork for old/new kernels
          setup	DXRN-MoonWake/KernelSU	main	dxrn-kernelsu-main	DXRN KernelSU main baseline
          setup	rsuntk/KernelSU	main	rsuntk-kernelsu-main	KernelSU-main style fallback for non-GKI/old kernels
          setup	KernelSU-Next/KernelSU-Next	next	ksunext-legacy	Upstream KSUNext legacy mode
          setup	DXRN-MoonWake/KernelSU-Next	next-manual-v1.5	ksunext-next-manual-v1.5	DXRN KSUNext manual hook candidate
          setup	DXRN-MoonWake/KernelSU-Next	next-susfs	ksunext-next-susfs	DXRN KSUNext SuSFS candidate
          setup	DXRN-MoonWake/KernelSU-Next	stable	ksunext-stable	Last resort with compat shim
          EOF

          make_common_array() {
            MAKE_COMMON=(O="$OUT_DIR" ARCH=arm64 SUBARCH=arm64 CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1)
          }

          write_droidspaces_fragments() {
            local src="$1"
            mkdir -p "$src/arch/arm64/configs/vendor"
            cat > "$src/arch/arm64/configs/vendor/droidspaces.config" <<'EOF'
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_NSFS=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_NET_NS=y
          CONFIG_USER_NS=n
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_PERF=y
          CONFIG_CGROUP_BPF=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_EXT4_FS_SECURITY=y
          CONFIG_FUSE_FS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_TUN=y
          CONFIG_DUMMY=y
          CONFIG_MACVLAN=y
          CONFIG_IPVLAN=y
          CONFIG_VXLAN=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF
            cat > "$src/arch/arm64/configs/vendor/no-root-frameworks.config" <<'EOF'
          # CONFIG_KSU is not set
          # CONFIG_KSU_SUSFS is not set
          # CONFIG_KPM is not set
          EOF
          }

          select_defconfig() {
            local src="$1" def="$DEFCONFIG_INPUT"
            if [ ! -f "$src/arch/arm64/configs/$def" ]; then
              def="$(find "$src/arch/arm64/configs" -maxdepth 3 -type f \( -name '*ruby*defconfig' -o -name '*mt6877*defconfig' \) | sed "s#$src/arch/arm64/configs/##" | sort | head -n1)"
            fi
            test -n "$def" && test -f "$src/arch/arm64/configs/$def" || { echo "ERROR: no defconfig" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-defconfig-error.log"; return 1; }
            echo "$def"
          }

          audit_remote_branch() {
            local repo="$1" branch="$2" label="$3"
            { echo "Repo: $repo"; echo "Branch: $branch"; echo "Label: $label"; git ls-remote "https://github.com/${repo}.git" "refs/heads/${branch}" || true; git ls-remote --tags "https://github.com/${repo}.git" | tail -50 || true; } | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-remote-audit.log"
          }

          apply_setup_ksu() {
            local src="$1" repo="$2" branch="$3" label="$4"
            pushd "$src" >/dev/null
            curl -L --fail --retry 3 --retry-delay 5 "https://raw.githubusercontent.com/${repo}/${branch}/kernel/setup.sh" -o ksu-setup.sh 2>&1 | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-ksu-setup.log"
            if [ "$label" = "ksunext-legacy" ]; then
              bash ksu-setup.sh legacy 2>&1 | tee -a "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-ksu-setup.log"
            else
              bash ksu-setup.sh 2>&1 | tee -a "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-ksu-setup.log"
            fi
            popd >/dev/null
          }

          apply_aeron_ksu_susfs_patch() {
            local src="$1" repo="$2" branch="$3" label="$4"
            local audit="$WORKSPACE_DIR/aeron-audit-${label}" patchfile="$ARTIFACTS_DIR/source/${MATRIX_VARIANT}-${label}-aeron-kernelsu-main-susfs-filtered.patch"
            rm -rf "$audit"
            git clone --depth 500 --branch "$branch" "https://github.com/${repo}.git" "$audit"
            pushd "$audit" >/dev/null
            git remote add stock "https://github.com/${KERNEL_REPO_INPUT}.git" || true
            git fetch stock "$KERNEL_BRANCH_INPUT" --depth 500 || true
            git rev-parse HEAD | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-aeron-head.log"
            git show -s --format='%H%n%cI%n%s' HEAD | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-aeron-latest.log"
            git log --oneline --all --grep='KSU\|KernelSU\|SuSFS\|susfs\|selinux\|ksu_module\|umount\|hook' | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-aeron-related-commits.log" || true
            git diff --name-status "stock/${KERNEL_BRANCH_INPUT}...HEAD" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-aeron-vs-stock-name-status.log" || true
            git diff --stat "stock/${KERNEL_BRANCH_INPUT}...HEAD" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-aeron-vs-stock-diffstat.log" || true
            git diff "stock/${KERNEL_BRANCH_INPUT}...HEAD" -- drivers/kernelsu drivers/Makefile drivers/Kconfig fs/exec.c fs/open.c fs/read_write.c fs/stat.c fs/namespace.c fs/namei.c fs/proc include/linux kernel security/selinux security/commoncap.c mm net arch/arm64/configs > "$patchfile" || true
            popd >/dev/null
            test -s "$patchfile" || { echo "ERROR: Aeron filtered patch empty" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-aeron-patch-error.log"; return 1; }
            pushd "$src" >/dev/null
            patch -p1 --dry-run < "$patchfile" > "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-aeron-patch-dry-run.log" 2>&1 || { cat "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-aeron-patch-dry-run.log"; popd >/dev/null; return 1; }
            patch -p1 < "$patchfile" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-aeron-patch-apply.log"
            popd >/dev/null
          }

          audit_integrated_ksu() {
            local src="$1" label="$4"
            find "$src" -maxdepth 4 -type d \( -iname '*kernelsu*' -o -iname '*susfs*' -o -iname '*kpm*' -o -iname '*kpatch*' \) | sort | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-integrated-tree.log" || true
            for d in "$src"/KernelSU "$src"/KernelSU-Next "$src"/RKSU "$src"/drivers/kernelsu; do
              if [ -d "$d/.git" ]; then
                { git -C "$d" remote -v; git -C "$d" rev-parse HEAD; git -C "$d" show -s --format='%H%n%cI%n%s' HEAD; git -C "$d" log --oneline -20; } | tee -a "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-integrated-git.log" || true
              fi
            done
          }

          symbol_exists() { local src="$1" sym="$2"; grep -Rqs "^[[:space:]]*config[[:space:]]\+${sym}$" "$src"/Kconfig "$src"/drivers "$src"/fs "$src"/kernel "$src"/security "$src"/arch/arm64 2>/dev/null; }
          enable_if_exists() { local src="$1" cfg="$2" sym="${cfg#CONFIG_}"; if symbol_exists "$src" "$sym"; then scripts/config --file "$OUT_DIR/.config" --enable "$sym" || true; echo "$cfg enabled"; else echo "$cfg skipped"; fi | tee -a "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-config-symbols.log"; }

          apply_ksu_compat_patches() {
            local src="$1" label="$2"
            pushd "$src" >/dev/null
            if grep -Rqs "copy_to_kernel_nofault" drivers/kernelsu KernelSU-Next/kernel KernelSU/kernel 2>/dev/null && ! grep -Rqs "copy_to_kernel_nofault" include kernel mm arch 2>/dev/null; then
              target_file="$(grep -Rsl "copy_to_kernel_nofault" drivers/kernelsu KernelSU-Next/kernel KernelSU/kernel 2>/dev/null | head -n1)"
              if [ -n "$target_file" ]; then
                cp "$target_file" "$target_file.before-copy_to_kernel_nofault-compat" || true
                grep -q '^#include <linux/uaccess.h>' "$target_file" || sed -i '1i#include <linux/uaccess.h>' "$target_file"
                sed -i 's/copy_to_kernel_nofault/probe_kernel_write/g' "$target_file"
                echo "Patched $target_file: copy_to_kernel_nofault -> probe_kernel_write" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-compat-patches.log"
              fi
            fi
            popd >/dev/null
          }

          configure_kernel() {
            local src="$1" root_mode="$2" label="$3"
            pushd "$src" >/dev/null
            make_common_array
            defconfig="$(select_defconfig "$src")"
            echo "DEFCONFIG=${defconfig}" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-selected-defconfig.log"
            make "${MAKE_COMMON[@]}" "$defconfig"
            scripts/config --file "$OUT_DIR/.config" --set-str LOCALVERSION "-${VARIANT_SUFFIX}-${label}"
            scripts/config --file "$OUT_DIR/.config" --disable LOCALVERSION_AUTO || true
            [ "$root_mode" != "none" ] || scripts/kconfig/merge_config.sh -m -O "$OUT_DIR" "$OUT_DIR/.config" arch/arm64/configs/vendor/no-root-frameworks.config
            scripts/kconfig/merge_config.sh -m -O "$OUT_DIR" "$OUT_DIR/.config" arch/arm64/configs/vendor/droidspaces.config
            if [ "$root_mode" = "ksu" ]; then
              for cfg in CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_KSU_KPROBE_HOOKS CONFIG_KSU_KPROBES_HOOK CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_TRY_UMOUNT CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL; do enable_if_exists "$src" "$cfg"; done
            fi
            make "${MAKE_COMMON[@]}" olddefconfig
            cp "$OUT_DIR/.config" "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-final-kernel.config"
            grep -E '^CONFIG_KSU|^CONFIG_KPM|^CONFIG_KALLSYMS|^CONFIG_OVERLAY_FS=|^CONFIG_IPC_NS=|^CONFIG_PID_NS=|^CONFIG_NET_NS=|^CONFIG_CGROUPS=|^CONFIG_DEVTMPFS=|^CONFIG_IKCONFIG=' "$OUT_DIR/.config" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-root-droidspaces-config.log" || true
            popd >/dev/null
          }

          build_kernel_strict() {
            local src="$1" label="$2"
            pushd "$src" >/dev/null
            make_common_array
            set +e
            make -j"$(nproc --all)" "${MAKE_COMMON[@]}" 2>&1 | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-build.log"
            rc=${PIPESTATUS[0]}
            set -e
            [ "$rc" = "0" ] || { echo "ERROR: make failed rc=$rc" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-build-error.log"; popd >/dev/null; return 1; }
            boot="$OUT_DIR/arch/arm64/boot"
            find "$boot" -maxdepth 4 -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' -o -name 'dtbo.img' \) -printf '%p %s bytes\n' | sort | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-build-outputs.log"
            [ -s "$boot/Image.gz" ] || [ -s "$boot/Image.gz-dtb" ] || { echo "ERROR: kernel image missing" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-missing-image.log"; popd >/dev/null; return 1; }
            popd >/dev/null
          }

          package_anykernel_strict() {
            local src="$1" label="$2" ak="$WORKSPACE_DIR/anykernel-${MATRIX_VARIANT}-${label}" kernel_boot="$src/$OUT_DIR/arch/arm64/boot"
            [ -s "$kernel_boot/Image.gz" ] || [ -s "$kernel_boot/Image.gz-dtb" ] || return 1
            rm -rf "$ak"; mkdir -p "$ak"; unzip -q "$WORKSPACE_DIR/aeron-anykernel-base.zip" -d "$ak"
            rm -f "$ak"/Image "$ak"/Image.gz "$ak"/Image.gz-dtb "$ak"/*.dtb "$ak"/*.dtbo "$ak"/dtbo.img || true
            [ ! -s "$kernel_boot/Image.gz-dtb" ] || cp "$kernel_boot/Image.gz-dtb" "$ak/Image.gz-dtb"
            [ ! -s "$kernel_boot/Image.gz" ] || cp "$kernel_boot/Image.gz" "$ak/Image.gz"
            [ ! -s "$kernel_boot/Image" ] || cp "$kernel_boot/Image" "$ak/Image"
            [ ! -s "$kernel_boot/dtbo.img" ] || cp "$kernel_boot/dtbo.img" "$ak/dtbo.img"
            find "$kernel_boot/dts" -type f \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp -f {} "$ak/" \; 2>/dev/null || true
            echo -e "Variant: ${MATRIX_VARIANT}\nLabel: ${label}\nRoot mode: ${ROOT_MODE}\nKernel repo: ${KERNEL_REPO_INPUT}\nKernel branch: ${KERNEL_BRANCH_INPUT}\nCreated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$ak/build-manifest-${MATRIX_VARIANT}.txt"
            find "$ak" -maxdepth 4 -type f -printf '%p %s bytes\n' | sort | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-anykernel-tree.log"
            [ -s "$ak/Image.gz" ] || [ -s "$ak/Image.gz-dtb" ] || return 1
            zip_name="Rubyx-${DEVICE_CODENAME}-${VARIANT_SUFFIX}-${label}-$(date -u +%Y%m%d-%H%M%S).zip"
            zip_path="$ARTIFACTS_DIR/zips/$zip_name"
            (cd "$ak" && zip -r9 "$zip_path" .)
            unzip -l "$zip_path" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-zip-list.log"
            unzip -l "$zip_path" | grep -Eq 'Image\.gz|Image\.gz-dtb' || { rm -f "$zip_path"; return 1; }
            zip_size="$(stat -c%s "$zip_path")"
            echo "$zip_size bytes" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-zip-size.log"
            [ "$zip_size" -ge 10000000 ] || { echo "ERROR: zip too small" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-${label}-zip-too-small.log"; rm -f "$zip_path"; return 1; }
            sha256sum "$zip_path" | tee "$ARTIFACTS_DIR/logs/$zip_name.sha256"
            echo "$zip_name" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-selected-output-zip.log"
          }

          run_attempt() {
            local mode="$1" root_mode="$2" repo="$3" branch="$4" label="$5" src="$WORKSPACE_DIR/kernel-src-${MATRIX_VARIANT}-${label}"
            rm -rf "$src"
            rsync -a --delete --exclude='.git' "$KERNEL_CLEAN/" "$src/"
            write_droidspaces_fragments "$src"
            if [ "$root_mode" = "ksu" ]; then
              audit_remote_branch "$repo" "$branch" "$label"
              if [ "$mode" = "aeron-patch" ]; then apply_aeron_ksu_susfs_patch "$src" "$repo" "$branch" "$label"; else apply_setup_ksu "$src" "$repo" "$branch" "$label"; fi
              audit_integrated_ksu "$src" "$repo" "$branch" "$label"
              apply_ksu_compat_patches "$src" "$label"
            fi
            configure_kernel "$src" "$root_mode" "$label"
            build_kernel_strict "$src" "$label"
            package_anykernel_strict "$src" "$label"
          }

          if [ "$ROOT_MODE" = "none" ]; then run_attempt none none local vanilla vanilla; exit 0; fi
          success=0
          while IFS=$'\t' read -r mode repo branch label reason; do
            [ "$mode" != "mode" ] || continue
            echo "== KSU candidate: $mode $repo $branch $label ==" | tee -a "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-fallback.log"
            if run_attempt "$mode" ksu "$repo" "$branch" "$label"; then
              echo -e "${mode}\t${repo}\t${branch}\t${label}\tSUCCESS" | tee "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-selected-ksu-source.tsv"
              success=1; break
            else
              echo -e "${mode}\t${repo}\t${branch}\t${label}\tFAILED" | tee -a "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-fallback.log"
            fi
          done < "$ARTIFACTS_DIR/manifests/ksu-fallback-order.tsv"
          [ "$success" = "1" ] || { echo "ERROR: all KSU candidates failed" | tee -a "$ARTIFACTS_DIR/logs/${MATRIX_VARIANT}-fallback.log"; exit 1; }

      - name: Final artifact tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -maxdepth 6 -type f | sort | tee artifacts/logs/final-artifacts-tree-${{ matrix.variant }}.log
          df -h | tee artifacts/logs/disk-after-${{ matrix.variant }}.log || true
          free -h | tee artifacts/logs/memory-after-${{ matrix.variant }}.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rubyx-${{ env.DEVICE_CODENAME }}-${{ matrix.variant }}
          path: artifacts/
          retention-days: 30
